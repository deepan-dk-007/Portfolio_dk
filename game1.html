<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DK GAMEZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>

    /* ── Global ── */
    * { touch-action: manipulation; }
    body { margin: 0; overflow: hidden; }

    canvas {
      background: #000;
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* ── HUD bar ── */
    #hudBar {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      flex-direction: row;
      gap: 10px;
      z-index: 1500;
      user-select: none;
    }
    .hud-item {
      background: rgba(0,0,0,0.65);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }
    #coinHUD    { color: gold;    border: 2px solid gold;    }
    #diamondHUD { color: #00eeff; border: 2px solid #00eeff; }
    #keyHUD     { color: #ffaa00; border: 2px solid #ffaa00; }

    /* ── Exit button ── */
    #exitBtn {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.7);
      color: #ff4444;
      border: 2px solid #ff4444;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1600;
      user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Shop button ── */
    #shopBtn {
      display: none;
      position: absolute;
      top: 12px;
      right: 120px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid gold;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1600;
      user-select: none;
    }

    /* ── Message board ── */
    #msgBoard {
      display: none;
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      padding: 8px 22px;
      border-radius: 30px;
      border: 2px solid rgba(255,255,255,0.35);
      z-index: 1600;
      max-width: 80vw;
      text-align: center;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    /* ── Controls ── */
    #controls {
      display: none;
      position: absolute;
      width: 100%;
      bottom: 20px;
      justify-content: space-between;
      user-select: none;
      -webkit-user-select: none;
    }
    .left-controls  { display: flex; gap: 55px; padding-left: 65px; }
    .right-controls { display: flex; gap: 20px; padding-right: 45px; }
    #controls button {
      background-color: white;
      border: none;
      padding: 15px 30px;
      font-size: 25px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Rotate notice ── */
    #rotateNotice {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      color: #fff;
      font-size: 30px;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 9999;
      padding: 30px;
    }

    /* ── Main menu buttons ── */
    #startBtn {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      z-index: 2000;
      background-color: black;
      border: 2px solid white;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
    }
    #startBtn h1 {
      margin: 0;
      padding: 40px;
      border-radius: 50px;
      color: transparent;
      background: linear-gradient(132deg, violet, darkblue, purple);
      background-size: 200%;
      background-clip: text;
      animation: shine 1s linear infinite;
    }
    #lvlbtn {
      position: absolute;
      top: 60%; left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid white;
      border-radius: 30px;
      padding: 15px;
      font-size: 15px;
      z-index: 2000;
      background-color: black;
      cursor: pointer;
      user-select: none;
    }
    #lvlbtn h2 {
      margin: 0;
      background: linear-gradient(132deg, violet, darkblue, purple);
      background-size: 200%;
      background-clip: text;
      color: transparent;
      animation: shine 1s linear infinite;
    }
    @keyframes shine {
      from { background-position: -200% 0; }
      to   { background-position:  200% 0; }
    }

    /* ── Level menu ── */
    #levelMenu {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      border: 3px solid white;
      border-radius: 20px;
      padding: 30px;
      z-index: 3000;
      text-align: center;
    }
    .levelGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .levelBtn { width: 60px; height: 60px; font-size: 22px; border-radius: 10px; cursor: pointer; }

    /* ── Overlays ── */
    .centerOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 2000;
      user-select: none;
    }
    .overlay-box {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      color: white;
      padding: 36px 50px;
      font-size: 30px;
      border: 3px solid white;
      border-radius: 16px;
      text-align: center;
      min-width: 260px;
    }
    .overlay-box .sub { font-size: 16px; color: gold; margin-top: 10px; }
    .overlay-btn-row  { display: flex; gap: 14px; justify-content: center; margin-top: 22px; }
    .overlay-btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-retry { background: gold;    color: black; }
    .btn-quit  { background: #ff4444; color: white; }
    .btn-next  { background: #22cc55; color: white; }
    .btn-menu  { background: #555;    color: white; }

    /* ── Settings / About ── */
    #settingsBtn {
      position: absolute;
      top: 60%; left: 75%;
      transform: translate(-50%, -50%);
      padding: 1px;
      border-radius: 20px;
      background: black;
      color: red;
      border: 1px solid white;
      cursor: pointer;
      z-index: 2000;
    }
    #settingsMenu {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      border: 3px solid white;
      border-radius: 20px;
      padding: 30px;
      z-index: 5000;
      min-width: 300px;
    }
    .settingItem { margin: 20px 0; display: flex; justify-content: space-between; gap: 20px; }
    #aboutBtn {
      position: absolute;
      top: 60%; left: 27%;
      transform: translate(-50%, -50%);
      padding: 5px;
      border-radius: 20px;
      background: black;
      color: red;
      border: 1px solid white;
      cursor: pointer;
      z-index: 2000;
    }
    #aboutMenu {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      border: 3px solid white;
      border-radius: 30px;
      padding: 30px;
      text-align: center;
      z-index: 5000;
      width: 350px;
    }
    #closeAbout    { margin-top: 20px; padding: 10px 20px; }
    #closeSettings,
    #resetProgress { width: 100%; margin-top: 15px; padding: 10px; }

    /* ── Shop overlay ── */
    #shopOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      z-index: 4000;
      overflow-y: auto;
    }
    .shop-inner {
      max-width: 420px;
      margin: 40px auto;
      background: #111;
      border: 2px solid gold;
      border-radius: 20px;
      padding: 24px;
      color: #fff;
    }
    .shop-inner h2  { text-align: center; color: gold; margin: 0 0 6px; }
    .shop-balances  { text-align: center; margin-bottom: 16px; font-size: 15px; }
    .shop-close-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: gold;
      color: black;
      font-size: 16px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

  </style>
</head>
<body>

<!-- Canvas -->
<canvas id="gameCanvas"></canvas>

<!-- Sounds -->
<audio id="jumpSound"    src="jump.mp3"    preload="auto"></audio>
<audio id="winSound"     src="won.mp3"     preload="auto"></audio>
<audio id="loseSound"    src="lose.mp3"    preload="auto"></audio>
<audio id="coinSound"    src="coin.mp3"    preload="auto"></audio>
<audio id="bounceSound"  src="bounce.mp3"  preload="auto"></audio>
<audio id="bombSound"    src="bomb.mp3"    preload="auto"></audio>
<audio id="airSound"     src="air.mp3"     preload="auto"></audio>
<audio id="mobSound"     src="mob.mp3"     preload="auto"></audio>
<audio id="diamondSound" src="diamond.mp3" preload="auto"></audio>
<audio id="keySound"     src="key.mp3"     preload="auto"></audio>

<!-- HUD -->
<div id="hudBar">
  <div class="hud-item" id="coinHUD">🪙 0</div>
  <div class="hud-item" id="diamondHUD">💎 0</div>
  <div class="hud-item" id="keyHUD">🗝️ 0/10</div>
</div>

<!-- Exit button -->
<button id="exitBtn">✖ Exit</button>

<!-- Shop button -->
<button id="shopBtn">🛒 Shop</button>

<!-- Message board -->
<div id="msgBoard"></div>

<!-- Controls -->
<div id="controls">
  <div class="left-controls">
    <button id="leftBtn">◀️</button>
    <button id="rightBtn">▶️</button>
  </div>
  <div class="right-controls">
    <button id="upBtn">⬆️</button>
  </div>
</div>

<!-- Rotate notice -->
<div id="rotateNotice">
  📱 Please rotate your device to <strong>landscape</strong> mode to play!
</div>

<!-- Main menu -->
<div><button id="startBtn"><h1>Start Game</h1></button></div>
<div><button id="lvlbtn"><h2>LEVELS</h2></button></div>

<div id="levelMenu">
  <h2>Select Level</h2>
  <div class="levelGrid">
    <button class="levelBtn">1</button>
    <button class="levelBtn">2</button>
    <button class="levelBtn">3</button>
    <button class="levelBtn">4</button>
    <button class="levelBtn">5</button>
    <button class="levelBtn">6</button>
    <button class="levelBtn">7</button>
    <button class="levelBtn">8</button>
    <button class="levelBtn">9</button>
    <button class="levelBtn">10</button>
  </div>
  <button id="closeLevels">Close</button>
</div>

<div><button id="settingsBtn"><h2>SETTINGS</h2></button></div>
<div id="settingsMenu">
  <h2>⚙️ SETTINGS</h2>
  <div class="settingItem">
    <label>🔊 Sound Effects</label>
    <input type="checkbox" id="soundToggle" checked>
  </div>
  <div class="settingItem">
    <label>📳 Vibration</label>
    <input type="checkbox" id="vibrationToggle" checked>
  </div>
  <div class="settingItem">
    <label>🎮 Control Size</label>
    <select id="controlSize">
      <option value="small">Small</option>
      <option value="medium" selected>Medium</option>
      <option value="large">Large</option>
    </select>
  </div>
  <div class="settingItem">
    <label>🌗 Theme</label>
    <select id="themeSelect">
      <option value="dark" selected>Dark</option>
      <option value="light">Light</option>
    </select>
  </div>
  <button id="resetProgress">Reset Progress</button>
  <button id="closeSettings">Close</button>
</div>

<div><button id="aboutBtn"><h2>ABOUT</h2></button></div>
<div id="aboutMenu">
  <h2>🎮 DK GAMEZ</h2>
  <p>Welcome to DK GAMEZ!</p>
  <p>A platform adventure game created by DK.</p>
  <p>Avoid obstacles, jump across platforms, and reach the goal to win.</p>
  <p>Version 1.0</p>
  <button id="closeAbout">Close</button>
</div>

<!-- Shop overlay -->
<div id="shopOverlay">
  <div class="shop-inner">
    <h2>🛒 SHOP</h2>
    <div class="shop-balances">
      <span id="shopCoinDisplay"    style="color:gold;">🪙 0</span>
      &nbsp;&nbsp;
      <span id="shopDiamondDisplay" style="color:#00eeff;">💎 0</span>
    </div>
    <div id="shopItemList"></div>
    <button class="shop-close-btn"
      onclick="document.getElementById('shopOverlay').style.display='none'">
      ✖ Close Shop
    </button>
  </div>
</div>

<!-- Game Over overlay -->
<div id="playAgainOverlay" class="centerOverlay">
  <div class="overlay-box">
    💀 Game Over
    <div class="sub" id="loseCoinsMsg"></div>
    <div class="overlay-btn-row">
      <button class="overlay-btn btn-retry" id="retryBtn">🔄 Retry</button>
      <button class="overlay-btn btn-quit"  id="quitBtn">🏠 Quit</button>
    </div>
  </div>
</div>

<!-- You Win overlay -->
<div id="youWinOverlay" class="centerOverlay">
  <div class="overlay-box">
    🏆 You Win!
    <div class="sub" id="winCoinsMsg"></div>
    <div class="overlay-btn-row">
      <button class="overlay-btn btn-next" id="continueBtn">▶ Continue</button>
      <button class="overlay-btn btn-menu" id="winMenuBtn">🏠 Menu</button>
    </div>
  </div>
</div>

<script>
  // ===========================
  // CANVAS — responsive
  // ===========================
  const canvas = document.getElementById('gameCanvas');
  const ctx    = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize',            resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);

  // ===========================
  // SOUNDS
  // ===========================
  const jumpSound    = document.getElementById('jumpSound');
  const winSound     = document.getElementById('winSound');
  const loseSound    = document.getElementById('loseSound');
  const coinSound    = document.getElementById('coinSound');
  const bounceSound  = document.getElementById('bounceSound');
  const bombSound    = document.getElementById('bombSound');
  const airSound     = document.getElementById('airSound');
  const mobSound     = document.getElementById('mobSound');
  const diamondSound = document.getElementById('diamondSound');
  const keySound     = document.getElementById('keySound');

  const soundToggle     = document.getElementById('soundToggle');
  const vibrationToggle = document.getElementById('vibrationToggle');
  const themeSelect     = document.getElementById('themeSelect');
  const settingsMenu    = document.getElementById('settingsMenu');

  function playSound(audio) {
    if (!soundToggle.checked) return;
    try { audio.currentTime = 0; audio.play(); } catch (e) {}
  }

  // ===========================
  // IMAGES  (fallback to canvas drawing when file missing)
  // ===========================
  const imgBg        = new Image(); imgBg.src        = 'sky.jpg';
  const imgBall      = new Image(); imgBall.src      = 'ball.png';
  const imgBlock     = new Image(); imgBlock.src     = 'grass.png';
  const imgMob       = new Image(); imgMob.src       = 'mob.png';
  const imgObstacle  = new Image(); imgObstacle.src  = 'block.png';
  const imgObstacles = new Image(); imgObstacles.src = 'grass.png';
  const imgGate      = new Image(); imgGate.src      = 'door.png';
  const imgCoin      = new Image(); imgCoin.src      = 'Coin.png';
  const imgDiamond   = new Image(); imgDiamond.src   = 'diamond.png';
  const imgKey       = new Image(); imgKey.src       = 'key.png';
  const imgJump      = new Image(); imgJump.src      = 'jumppad.png';
  const imgAir       = new Image(); imgAir.src       = 'fan.png';
  const imgBomb      = new Image(); imgBomb.src      = 'bomb.png';

  function drawImg(img, color, x, y, w, h) {
    if (img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x, y, w, h);
    } else {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }
  }

  // ===========================
  // PLAYER
  // ===========================
  ball      = { x: 830, y: 630, radius: 10, dx: 0, dy: 0, onGround: false };
  gravity   = 0.5;
  jumpPower = -10;

  // ===========================
  // GAME VARIABLES
  // ===========================
  let selectedLevel = 1;
  let cameraX = 0, cameraY = 0;
  let anim;
  let gameRunning = false;

  // ===========================
  // LEVEL DATA ARRAYS
  // ===========================
  let blocks     = [], obstacles  = [], obstacless  = [];
  let mobstacles = [], gate       = [], resetGates  = [];
  let coins      = [], diamonds   = [], keys        = [];
  let jumpBlocks = [], airBlocks  = [], airBlockss  = [];
  let bombBlocks = [], bombBlockss= [];

  // ===========================
  // PERSISTENT STORAGE
  // ===========================
  let coinsCollected    = 0;
  let totalCoins        = Number(localStorage.getItem('totalCoins'))    || 0;
  let diamondsCollected = 0;
  let totalDiamonds     = Number(localStorage.getItem('totalDiamonds')) || 0;
  let collectedKeyIds   = JSON.parse(localStorage.getItem('collectedKeyIds') || '[]');
  let totalKeys         = collectedKeyIds.length;

  // ===========================
  // HUD
  // ===========================
  const hudBar     = document.getElementById('hudBar');
  const coinHUD    = document.getElementById('coinHUD');
  const diamondHUD = document.getElementById('diamondHUD');
  const keyHUD     = document.getElementById('keyHUD');
  const msgBoard   = document.getElementById('msgBoard');

  function updateHUDs() {
    coinHUD.textContent    = '🪙 '  + totalCoins;
    diamondHUD.textContent = '💎 '  + totalDiamonds;
    keyHUD.textContent     = '🗝️ ' + totalKeys + '/10';
  }
  updateHUDs();

  // ===========================
  // MESSAGE BOARD
  // ===========================
  let msgTimer = null;
  function showMsg(text, duration) {
    msgBoard.textContent   = text;
    msgBoard.style.display = 'block';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msgBoard.style.display = 'none'; }, duration || 3000);
  }

  // ===========================
  // BALL GROW (level 4 only)
  // ===========================
  const growRate   = 0.5;   // px added per second
  const maxRadius  = 40;    // cap
  const baseRadius = 10;    // reset value
  let lastGrowTime = performance.now();

  function growBall() {
    if (selectedLevel !== 4) return;
    const now     = performance.now();
    const elapsed = (now - lastGrowTime) / 1000;
    if (elapsed >= 1) {
      if (ball.radius < maxRadius) ball.radius += growRate;
      lastGrowTime = now;
    }
  }

  // ===========================
  // VISUAL EFFECTS  (particles)
  // ===========================
  const particles = [];

  // Dust puffs on landing
  function spawnDust(x, y) {
    for (let i = 0; i < 6; i++) {
      const angle = Math.PI + (Math.random() - 0.5) * Math.PI;
      particles.push({
        type: 'dust',
        x, y,
        vx: Math.cos(angle) * (1 + Math.random() * 2),
        vy: Math.sin(angle) * (1 + Math.random() * 1.5) - 0.5,
        life: 1,
        r: 4 + Math.random() * 4,
        color: '#c8a97a'
      });
    }
  }

  // Sparkles on coin collect
  function spawnCoinPop(x, y) {
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      particles.push({
        type: 'spark',
        x, y,
        vx: Math.cos(angle) * (2 + Math.random() * 2),
        vy: Math.sin(angle) * (2 + Math.random() * 2) - 1,
        life: 1,
        r: 3 + Math.random() * 3,
        color: '#f7c948'
      });
    }
    // "+1" float text
    particles.push({ type: 'text', x, y, vy: -1.2, life: 1, text: '+1', color: '#f7c948' });
  }

  // Explosion on bomb/lose
  function spawnExplosion(x, y) {
    for (let i = 0; i < 14; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      particles.push({
        type: 'spark',
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        r: 4 + Math.random() * 5,
        color: i % 2 === 0 ? '#ff6b00' : '#ff4444'
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= 0.04;
      if (p.type !== 'text') {
        p.x  += p.vx;
        p.y  += p.vy;
        p.vy += 0.1; // gravity on particles
      } else {
        p.y += p.vy;
      }
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.type === 'dust') {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - cameraX, p.y - cameraY, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'spark') {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - cameraX, p.y - cameraY, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'text') {
        ctx.fillStyle  = p.color;
        ctx.font       = 'bold 16px sans-serif';
        ctx.textAlign  = 'center';
        ctx.fillText(p.text, p.x - cameraX, p.y - cameraY);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ===========================
  // BALL VISUAL STATE
  // (squash on jump/land, stored separately from physics)
  // ===========================
  let ballScaleX = 1, ballScaleY = 1;

  function setBallSquash(sx, sy) { ballScaleX = sx; ballScaleY = sy; }

  function updateBallScale() {
    // Ease back to 1,1 each frame
    ballScaleX += (1 - ballScaleX) * 0.2;
    ballScaleY += (1 - ballScaleY) * 0.2;
  }

  // ===========================
  // DRAW BALL — canvas-drawn with eyes, shine, squash
  // (used when ball.png is missing)
  // ===========================
  function drawBallCanvas(x, y, r) {
    const sx = ballScaleX, sy = ballScaleY;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sx, sy);

    // Body gradient
    const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    grad.addColorStop(0,   '#ff9f6b');
    grad.addColorStop(0.6, '#e63946');
    grad.addColorStop(1,   '#9b1c1c');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Shine
    const shine = ctx.createRadialGradient(-r * 0.35, -r * 0.35, 0, -r * 0.2, -r * 0.2, r * 0.55);
    shine.addColorStop(0,   'rgba(255,255,255,0.55)');
    shine.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Eyes (only visible when radius is large enough)
    if (r >= 8) {
      const ey = -r * 0.1;
      const ex = r * 0.3;
      const er = r * 0.22;
      // Left eye
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-ex, ey, er, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-ex + er * 0.2, ey, er * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-ex + er * 0.35, ey - er * 0.3, er * 0.2, 0, Math.PI * 2); ctx.fill();
      // Right eye
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(ex + er * 0.2, ey, er * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex + er * 0.35, ey - er * 0.3, er * 0.2, 0, Math.PI * 2); ctx.fill();
      // Mouth
      ctx.strokeStyle = '#fff';
      ctx.lineWidth   = r * 0.1;
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.arc(0, r * 0.2, r * 0.3, 0.15, Math.PI - 0.15);
      ctx.stroke();
    }

    ctx.restore();
  }

  // ===========================
  // DRAW COIN — canvas-drawn with gradient + shine
  // ===========================
  function drawCoinCanvas(x, y, r) {
    const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.05, x, y, r);
    grad.addColorStop(0,   '#fff7aa');
    grad.addColorStop(0.5, '#f7c948');
    grad.addColorStop(1,   '#b8860b');
    ctx.fillStyle   = grad;
    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Inner ring
    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth   = 1;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // $ symbol
    ctx.fillStyle  = '#b8860b';
    ctx.font       = `bold ${Math.round(r * 1.1)}px Georgia,serif`;
    ctx.textAlign  = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', x, y + r * 0.05);
    ctx.textBaseline = 'alphabetic';
    // Shine
    ctx.fillStyle   = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.3, y - r * 0.3, r * 0.3, r * 0.18, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===========================
  // DRAW DIAMOND — canvas-drawn with facets
  // ===========================
  function drawDiamondCanvas(x, y, r) {
    const grad = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
    grad.addColorStop(0,   '#a8f0ff');
    grad.addColorStop(0.4, '#00eeff');
    grad.addColorStop(1,   '#0077cc');
    ctx.fillStyle   = grad;
    ctx.strokeStyle = '#00eeff';
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(x,     y - r);
    ctx.lineTo(x + r, y);
    ctx.lineTo(x,     y + r);
    ctx.lineTo(x - r, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Facet lines
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth   = 0.8;
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.3, y - r * 0.35, r * 0.25, r * 0.14, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===========================
  // DRAW KEY — canvas-drawn
  // ===========================
  function drawKeyCanvas(x, y, r) {
    const grad = ctx.createRadialGradient(x - r * 0.2, y - r * 0.5, r * 0.1, x, y - r * 0.3, r * 0.6);
    grad.addColorStop(0,   '#ffe680');
    grad.addColorStop(1,   '#cc8800');
    ctx.fillStyle   = grad;
    ctx.strokeStyle = '#996600';
    ctx.lineWidth   = 1.2;
    // Key ring
    ctx.beginPath(); ctx.arc(x, y - r * 0.3, r * 0.55, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath(); ctx.arc(x, y - r * 0.3, r * 0.28, 0, Math.PI * 2); ctx.fill();
    // Shaft
    ctx.fillStyle   = grad;
    ctx.strokeStyle = '#996600';
    ctx.fillRect(x - r * 0.1, y + r * 0.2, r * 0.22, r * 0.85);
    ctx.strokeRect(x - r * 0.1, y + r * 0.2, r * 0.22, r * 0.85);
    // Teeth
    ctx.fillRect(x + r * 0.12, y + r * 0.5,  r * 0.28, r * 0.18);
    ctx.fillRect(x + r * 0.12, y + r * 0.75, r * 0.22, r * 0.16);
    // Shine
    ctx.fillStyle   = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.15, y - r * 0.5, r * 0.2, r * 0.12, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===========================
  // DRAW GATE — canvas-drawn portal door
  // ===========================
  function drawGateCanvas(x, y, w, h) {
    // Frame
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0,   '#ffe97a');
    grad.addColorStop(1,   '#cc8800');
    ctx.fillStyle   = grad;
    ctx.strokeStyle = '#cc8800';
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 4);
    ctx.fill(); ctx.stroke();
    // Door panel
    ctx.fillStyle = '#0a0a18';
    ctx.fillRect(x + w * 0.1, y + h * 0.08, w * 0.8, h * 0.92);
    // Portal glow ring
    ctx.strokeStyle = '#4ecca3';
    ctx.lineWidth   = 1.5;
    const cx2 = x + w / 2, cy2 = y + h * 0.55, pr = Math.min(w, h) * 0.28;
    ctx.beginPath(); ctx.arc(cx2, cy2, pr, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle   = 'rgba(78,204,163,0.25)';
    ctx.beginPath(); ctx.arc(cx2, cy2, pr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle   = '#4ecca3';
    ctx.beginPath(); ctx.arc(cx2, cy2, pr * 0.3, 0, Math.PI * 2); ctx.fill();
    // Door handle
    ctx.fillStyle   = grad;
    ctx.strokeStyle = '#cc8800';
    ctx.lineWidth   = 1;
    ctx.beginPath(); ctx.arc(x + w * 0.7, y + h * 0.6, w * 0.08, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Frame shine
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x, y, w * 0.25, h);
  }

  // ===========================
  // DRAW JUMP PAD — canvas-drawn
  // ===========================
  function drawJumpPadCanvas(x, y, w, h) {
    // Spring coils
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth   = 2;
    const coils = 4, coilH = h * 0.55 / coils;
    for (let i = 0; i < coils; i++) {
      const cy3 = y + h * 0.45 + i * coilH;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.25, cy3);
      ctx.lineTo(x + w * 0.75, cy3 + coilH * 0.5);
      ctx.stroke();
    }
    // Pad base (orange with yellow stripe)
    const padGrad = ctx.createLinearGradient(x, y + h * 0.45, x, y + h);
    padGrad.addColorStop(0, '#ff9f1c');
    padGrad.addColorStop(1, '#e05500');
    ctx.fillStyle = padGrad;
    ctx.beginPath(); ctx.roundRect(x, y + h * 0.45, w, h * 0.55, 5); ctx.fill();
    ctx.fillStyle = '#ffe066';
    ctx.fillRect(x, y + h * 0.45, w, h * 0.12);
    // Up-arrows
    ctx.fillStyle = '#4ecca3';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.38, y + h * 0.4);
    ctx.lineTo(x + w * 0.5,  y + h * 0.08);
    ctx.lineTo(x + w * 0.62, y + h * 0.4);
    ctx.closePath(); ctx.fill();
  }

  // ===========================
  // DRAW BOMB — canvas-drawn
  // ===========================
  function drawBombCanvas(x, y, w, h) {
    const cx3 = x + w / 2, cy3 = y + h * 0.6, br = Math.min(w, h) * 0.42;
    // Body
    ctx.fillStyle   = '#1a1a1a';
    ctx.strokeStyle = '#444';
    ctx.lineWidth   = 1.5;
    ctx.beginPath(); ctx.arc(cx3, cy3, br, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Fuse base
    ctx.fillStyle = '#555';
    ctx.fillRect(cx3 - 3, y + h * 0.15, 6, h * 0.18);
    // Fuse wire
    ctx.strokeStyle = '#888';
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.moveTo(cx3, y + h * 0.15);
    ctx.quadraticCurveTo(cx3 + w * 0.3, y + h * 0.04, cx3 + w * 0.42, y + h * 0.08);
    ctx.stroke();
    // Spark
    ctx.fillStyle = '#ff6b00';
    ctx.beginPath(); ctx.arc(cx3 + w * 0.42, y + h * 0.06, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff176';
    ctx.beginPath(); ctx.arc(cx3 + w * 0.42, y + h * 0.06, 2, 0, Math.PI * 2); ctx.fill();
    // X mark
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth   = Math.max(2, br * 0.25);
    ctx.lineCap     = 'round';
    const xo = br * 0.45;
    ctx.beginPath(); ctx.moveTo(cx3 - xo, cy3 - xo); ctx.lineTo(cx3 + xo, cy3 + xo); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx3 + xo, cy3 - xo); ctx.lineTo(cx3 - xo, cy3 + xo); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // ===========================
  const shopItems = [
    { id: 'shield', name: '🛡️ Shield',      desc: 'Free hit for 1 minute',   cost: 300, type: 'coin'    },
    { id: 'boots',  name: '👟 Speed Boots', desc: 'Move 1.5× faster',        cost: 100, type: 'coin'    },
    { id: 'spring', name: '🌀 Super Jump',  desc: 'Double jump height',       cost: 80,  type: 'coin'    },
    { id: 'magnet', name: '🧲 Coin Magnet', desc: 'Auto-collect nearby',      cost: 5,   type: 'coin'    },
    { id: 'heart',  name: '❤️ Extra Life',  desc: 'Respawn once',             cost: 8,   type: 'diamond' },
  ];

  function getOwned() {
    return JSON.parse(localStorage.getItem('ownedItems') || '[]');
  }

  function renderShop() {
    document.getElementById('shopCoinDisplay').textContent    = '🪙 ' + totalCoins;
    document.getElementById('shopDiamondDisplay').textContent = '💎 ' + totalDiamonds;

    const owned = getOwned();
    const list  = document.getElementById('shopItemList');
    list.innerHTML = '';

    for (const item of shopItems) {
      const isOwned  = owned.includes(item.id);
      const currency = item.type === 'coin' ? '🪙' : '💎';
      const balance  = item.type === 'coin' ? totalCoins : totalDiamonds;
      const canBuy   = !isOwned && balance >= item.cost;

      const row = document.createElement('div');
      row.style.cssText = `
        display:flex;justify-content:space-between;align-items:center;
        background:#1a1a1a;border:1px solid #333;border-radius:12px;
        padding:12px 14px;margin-bottom:10px;gap:10px;`;

      row.innerHTML = `
        <div>
          <div style="font-size:17px;font-weight:bold;">${item.name}</div>
          <div style="font-size:13px;color:#aaa;">${item.desc}</div>
        </div>
        <button data-id="${item.id}" data-cost="${item.cost}" data-type="${item.type}"
          style="padding:8px 16px;border-radius:8px;border:none;
                 cursor:${canBuy ? 'pointer' : 'default'};
                 font-weight:bold;font-size:14px;white-space:nowrap;
                 background:${isOwned ? '#444' : canBuy ? 'gold' : '#333'};
                 color:${isOwned ? '#aaa' : canBuy ? 'black' : '#666'};">
          ${isOwned ? '✅ Owned' : currency + ' ' + item.cost}
        </button>`;

      list.appendChild(row);
    }

    list.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id    = btn.dataset.id;
        const cost  = Number(btn.dataset.cost);
        const type  = btn.dataset.type;
        const owned = getOwned();
        if (owned.includes(id)) return;

        if (type === 'coin' && totalCoins >= cost) {
          totalCoins -= cost;
          localStorage.setItem('totalCoins', totalCoins);
        } else if (type === 'diamond' && totalDiamonds >= cost) {
          totalDiamonds -= cost;
          localStorage.setItem('totalDiamonds', totalDiamonds);
        } else {
          showMsg('❌ Not enough ' + (type === 'coin' ? '🪙 coins' : '💎 diamonds') + '!', 2000);
          return;
        }

        owned.push(id);
        localStorage.setItem('ownedItems', JSON.stringify(owned));
        updateHUDs();
        renderShop();
        showMsg('✅ ' + shopItems.find(i => i.id === id).name + ' purchased!', 2000);
      });
    });
  }

  // ===========================
  // CONTROLS
  // ===========================
  function setupControls() {
    const leftBtn  = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    const upBtn    = document.getElementById('upBtn');

    let leftCount = 0, rightCount = 0;
    let jumpBuffered    = false;
    let jumpBufferTimer = null;

    function updateMovement() {
      if      (leftCount > 0 && rightCount === 0) ball.dx = -3;
      else if (rightCount > 0 && leftCount  === 0) ball.dx =  3;
      else                                          ball.dx =  0;
    }

    function tryJump() {
      if (ball.onGround) {
        ball.dy       = jumpPower;
        ball.onGround = false;
        playSound(jumpSound);
        jumpBuffered  = false;
        setBallSquash(1.3, 0.7); // stretch tall on jump
      } else {
        jumpBuffered = true;
        clearTimeout(jumpBufferTimer);
        jumpBufferTimer = setTimeout(() => { jumpBuffered = false; }, 120);
      }
    }

    window._checkBufferedJump = function () {
      if (jumpBuffered && ball.onGround) {
        ball.dy       = jumpPower;
        ball.onGround = false;
        playSound(jumpSound);
        jumpBuffered  = false;
        clearTimeout(jumpBufferTimer);
        setBallSquash(1.3, 0.7);
      }
    };

    function bindBtn(btn, onDown, onUp) {
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        onDown();
      });
      btn.addEventListener('pointerup',     e => { e.preventDefault(); onUp(); });
      btn.addEventListener('pointercancel', e => { e.preventDefault(); onUp(); });
      btn.addEventListener('pointerleave',  e => {
        if (!btn.hasPointerCapture(e.pointerId)) onUp();
      });
    }

    bindBtn(leftBtn,
      () => { leftCount++;  updateMovement(); },
      () => { leftCount  = Math.max(0, leftCount  - 1); updateMovement(); }
    );
    bindBtn(rightBtn,
      () => { rightCount++;  updateMovement(); },
      () => { rightCount = Math.max(0, rightCount - 1); updateMovement(); }
    );
    bindBtn(upBtn, () => tryJump(), () => {});

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight')               { rightCount = 1; updateMovement(); }
      if (e.key === 'ArrowLeft')                { leftCount  = 1; updateMovement(); }
      if (e.key === 'ArrowUp' || e.key === ' ')  tryJump();
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowRight') { rightCount = 0; updateMovement(); }
      if (e.key === 'ArrowLeft')  { leftCount  = 0; updateMovement(); }
    });
  }

  // ===========================
  // UPDATE
  // ===========================
  // Track previous onGround state for land-dust trigger
  let wasOnGround = false;

  function update() {
    growBall();

    ball.x  += ball.dx;
    ball.y  += ball.dy;
    ball.dy += gravity;
    ball.onGround = false;

    cameraX = ball.x - canvas.width  / 2;
    cameraY = ball.y - canvas.height / 2;

    // Solid blocks
    for (const block of blocks) {
      const cx = Math.max(block.x, Math.min(ball.x, block.x + block.width));
      const cy = Math.max(block.y, Math.min(ball.y, block.y + block.height));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy < ball.radius * ball.radius) {
        const ox = ball.radius - Math.abs(dx);
        const oy = ball.radius - Math.abs(dy);
        if (ox < oy) {
          ball.x += dx > 0 ? ox : -ox;
          ball.dx = 0;
        } else {
          ball.y += dy > 0 ? oy : -oy;
          ball.dy = 0;
          if (dy < 0) { ball.onGround = true; window._checkBufferedJump(); }
        }
      }
    }



    // Moving platforms
    for (const mobs of mobstacles) {
      if (mobs.dx) { mobs.x += mobs.dx; if (mobs.x > mobs.sx+100 || mobs.x < mobs.sx-100) mobs.dx *= -1; }
      if (mobs.dy) { mobs.y += mobs.dy; if (mobs.y > mobs.sy+100 || mobs.y < mobs.sy-100) mobs.dy *= -1; }
      const cx = Math.max(mobs.x, Math.min(ball.x, mobs.x + mobs.width));
      const cy = Math.max(mobs.y, Math.min(ball.y, mobs.y + mobs.height));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy < ball.radius * ball.radius) {
        const ox = ball.radius - Math.abs(dx);
        const oy = ball.radius - Math.abs(dy);
        if (ox < oy) {
          ball.x += dx > 0 ? ox : -ox;
          ball.dx = 0;
        } else {
          ball.y += dy > 0 ? oy : -oy;
          ball.dy = 0;
          if (dy < 0) {
            ball.onGround = true;
            window._checkBufferedJump();
            if (mobs.dx) ball.x += mobs.dx;
            if (mobs.dy) ball.y += mobs.dy;
          }
        }
      }
    }

    // Coins
    for (const coin of coins) {
      if (coin.collected) continue;
      const dx = ball.x - coin.x, dy = ball.y - coin.y;
      if (Math.sqrt(dx*dx + dy*dy) < ball.radius + coin.radius) {
        coin.collected = true;
        coinsCollected++; totalCoins++;
        localStorage.setItem('totalCoins', totalCoins);
        updateHUDs();
        playSound(coinSound);
        spawnCoinPop(coin.x, coin.y);
      }
    }

    // Diamonds
    for (const dia of diamonds) {
      if (dia.collected) continue;
      const dx = ball.x - dia.x, dy = ball.y - dia.y;
      if (Math.sqrt(dx*dx + dy*dy) < ball.radius + dia.radius) {
        dia.collected = true;
        diamondsCollected++; totalDiamonds++;
        localStorage.setItem('totalDiamonds', totalDiamonds);
        updateHUDs();
        playSound(diamondSound);
        spawnCoinPop(dia.x, dia.y);
        showMsg('💎 Diamond collected!', 2000);
      }
    }

    // Keys
    for (const k of keys) {
      if (k.collected || collectedKeyIds.includes(k.id)) continue;
      const dx = ball.x - k.x, dy = ball.y - k.y;
      if (Math.sqrt(dx*dx + dy*dy) < ball.radius + k.radius) {
        k.collected = true;
        collectedKeyIds.push(k.id);
        totalKeys = collectedKeyIds.length;
        localStorage.setItem('collectedKeyIds', JSON.stringify(collectedKeyIds));
        updateHUDs();
        playSound(keySound);
        showMsg('🗝️ Key ' + totalKeys + '/10 found!', 2500);
      }
    }

    // Jump blocks
    for (const jb of jumpBlocks) {
      const cx = Math.max(jb.x, Math.min(ball.x, jb.x + jb.width));
      const cy = Math.max(jb.y, Math.min(ball.y, jb.y + jb.height));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy < ball.radius * ball.radius) {
        const ox = ball.radius - Math.abs(dx);
        const oy = ball.radius - Math.abs(dy);
        if (ox < oy) {
          ball.x += dx > 0 ? ox : -ox;
          ball.dx = 0;
        } else {
          ball.y += dy > 0 ? oy : -oy;
          if (dy < 0) { ball.dy = jumpPower * (jb.boost || 1.8); playSound(bounceSound); setBallSquash(1.25, 0.75); }
          else         ball.dy = 0;
        }
      }
    }

    // Air blocks
    for (const ab of [...airBlocks, ...airBlockss]) {
      if (ball.x+ball.radius > ab.x && ball.x-ball.radius < ab.x+ab.width &&
          ball.y+ball.radius > ab.y && ball.y-ball.radius < ab.y+ab.height) {
        ball.dx += ab.forceX || 0;
        ball.dy += ab.forceY || 0;
        ball.dx = Math.max(-8, Math.min(8, ball.dx));
        ball.dy = Math.max(-8, Math.min(8, ball.dy));
      }
    }

    // Bomb blocks (real — trigger lose)
    for (const bb of bombBlocks) {
      if (ball.x+ball.radius > bb.x && ball.x-ball.radius < bb.x+bb.width &&
          ball.y+ball.radius > bb.y && ball.y-ball.radius < bb.y+bb.height) {
        playSound(bombSound);
        triggerLose();
      }
    }

    // Bomb blocks (fake — sound only)
    for (const bbb of bombBlockss) {
      if (ball.x+ball.radius > bbb.x && ball.x-ball.radius < bbb.x+bbb.width &&
          ball.y+ball.radius > bbb.y && ball.y-ball.radius < bbb.y+bbb.height) {
        playSound(bombSound);
      }
    }

    // Obstacles (kill)
    for (const obs of obstacles) {
      if (obs.dx) { obs.x += obs.dx; if (obs.x > obs.sx+100 || obs.x < obs.sx-100) obs.dx *= -1; }
      if (obs.dy) { obs.y += obs.dy; if (obs.y > obs.sy+100 || obs.y < obs.sy-100) obs.dy *= -1; }
      if (ball.x+ball.radius > obs.x && ball.x-ball.radius < obs.x+obs.width &&
          ball.y+ball.radius > obs.y && ball.y-ball.radius < obs.y+obs.height) {
        triggerLose();
      }
    }

    // Monster obstacles (kill)
    for (const obss of obstacless) {
      if (obss.dx) { obss.x += obss.dx; if (obss.x > obss.sx+100 || obss.x < obss.sx-100) obss.dx *= -1; }
      if (obss.dy) { obss.y += obss.dy; if (obss.y > obss.sy+100 || obss.y < obss.sy-100) obss.dy *= -1; }
      if (ball.x+ball.radius > obss.x && ball.x-ball.radius < obss.x+obss.width &&
          ball.y+ball.radius > obss.y && ball.y-ball.radius < obss.y+obss.height) {
        triggerLose();
      }
    }

    // Reset gates (teleport back to start position)
    for (const rg of resetGates) {
      if (ball.x+ball.radius > rg.x && ball.x-ball.radius < rg.x+rg.width &&
          ball.y+ball.radius > rg.y && ball.y-ball.radius < rg.y+rg.height) {
        ball.x = rg.startX; ball.y = rg.startY;
        ball.dx = 0; ball.dy = 0;
        spawnDust(ball.x, ball.y + ball.radius);
        showMsg('⚠️ Back to start!', 1500);
      }
    }

    // Gate (win)
    for (const gbs of gate) {
      if (ball.x+ball.radius > gbs.x && ball.x-ball.radius < gbs.x+gbs.width &&
          ball.y+ball.radius > gbs.y && ball.y-ball.radius < gbs.y+gbs.width && !gbs.mov) {
        triggerWin();
      }
    }

    // Land effect — fires only once on the frame ball first touches ground
    if (ball.onGround && !wasOnGround) {
      spawnDust(ball.x, ball.y + ball.radius);
      setBallSquash(1.4, 0.6);
    }
    wasOnGround = ball.onGround;

    updateParticles();
    updateBallScale();
                   
  }

  // ===========================
  // DRAW
  // ===========================
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    if (imgBg.complete && imgBg.naturalWidth > 0)
      ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);

    // Solid blocks
    for (const b of blocks) {
      if (imgBlock.complete && imgBlock.naturalWidth > 0) {
        ctx.drawImage(imgBlock, b.x-cameraX, b.y-cameraY, b.width, b.height);
      } else {
        // Canvas-drawn grass block
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(b.x-cameraX, b.y-cameraY, b.width, b.height);
        ctx.fillStyle = '#2d8a2d';
        ctx.fillRect(b.x-cameraX, b.y-cameraY, b.width, Math.min(16, b.height));
      }
    }

    // Moving platforms
    for (const m of mobstacles) {
      if (imgMob.complete && imgMob.naturalWidth > 0) {
        ctx.drawImage(imgMob, m.x-cameraX, m.y-cameraY, m.width, m.height);
      } else {
        const mg = ctx.createLinearGradient(m.x-cameraX, m.y-cameraY, m.x-cameraX, m.y-cameraY+m.height);
        mg.addColorStop(0, '#78c0e0'); mg.addColorStop(1, '#1a6080');
        ctx.fillStyle = mg;
        ctx.beginPath(); ctx.roundRect(m.x-cameraX, m.y-cameraY, m.width, m.height, 6); ctx.fill();
        ctx.strokeStyle = '#4ecca3'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(m.x-cameraX, m.y-cameraY, m.width, m.height, 6); ctx.stroke();
      }
    }

    // Jump blocks
    for (const jb of jumpBlocks) {
      if (imgJump.complete && imgJump.naturalWidth > 0) {
        ctx.drawImage(imgJump, jb.x-cameraX, jb.y-cameraY, jb.width, jb.height);
      } else {
        drawJumpPadCanvas(jb.x-cameraX, jb.y-cameraY, jb.width, jb.height);
      }
    }

    // Air blocks
    for (const ab of airBlocks) {
      if (imgAir.complete && imgAir.naturalWidth > 0) {
        ctx.drawImage(imgAir, ab.x-cameraX, ab.y-cameraY, ab.width, ab.height);
      } else {
        ctx.fillStyle = 'rgba(0,255,255,0.3)';
        ctx.fillRect(ab.x-cameraX, ab.y-cameraY, ab.width, ab.height);
        ctx.strokeStyle = 'rgba(0,255,255,0.7)'; ctx.lineWidth = 1.5;
        ctx.strokeRect(ab.x-cameraX, ab.y-cameraY, ab.width, ab.height);
      }
    }

    // Fake air blocks
    for (const abb of airBlockss) {
      if (imgAir.complete && imgAir.naturalWidth > 0) {
        ctx.drawImage(imgAir, abb.x-cameraX, abb.y-cameraY, abb.width, abb.height);
      } else {
        ctx.fillStyle = '#2d8a2d';
        ctx.fillRect(abb.x-cameraX, abb.y-cameraY, abb.width, abb.height);
      }
    }

    // Bomb blocks (real + fake)
    for (const bb of [...bombBlocks, ...bombBlockss]) {
      if (imgBomb.complete && imgBomb.naturalWidth > 0) {
        ctx.drawImage(imgBomb, bb.x-cameraX, bb.y-cameraY, bb.width, bb.height);
      } else {
        drawBombCanvas(bb.x-cameraX, bb.y-cameraY, bb.width, bb.height);
      }
    }

    // Coins
    for (const coin of coins) {
      if (coin.collected) continue;
      if (imgCoin.complete && imgCoin.naturalWidth > 0) {
        ctx.drawImage(imgCoin,
          coin.x-cameraX-coin.radius, coin.y-cameraY-coin.radius,
          coin.radius*2, coin.radius*2);
      } else {
        drawCoinCanvas(coin.x-cameraX, coin.y-cameraY, coin.radius);
      }
    }

    // Diamonds
    for (const dia of diamonds) {
      if (dia.collected) continue;
      if (imgDiamond.complete && imgDiamond.naturalWidth > 0) {
        ctx.drawImage(imgDiamond,
          dia.x-cameraX-dia.radius, dia.y-cameraY-dia.radius,
          dia.radius*2, dia.radius*2);
      } else {
        drawDiamondCanvas(dia.x-cameraX, dia.y-cameraY, dia.radius);
      }
    }

    // Keys
    for (const k of keys) {
      if (k.collected || collectedKeyIds.includes(k.id)) continue;
      if (imgKey.complete && imgKey.naturalWidth > 0) {
        ctx.drawImage(imgKey,
          k.x-cameraX-k.radius, k.y-cameraY-k.radius,
          k.radius*2, k.radius*2);
      } else {
        drawKeyCanvas(k.x-cameraX, k.y-cameraY, k.radius);
      }
    }

    // Obstacles
    for (const obs of obstacles) {
      if (imgObstacles.complete && imgObstacles.naturalWidth > 0) {
        ctx.drawImage(imgObstacles, obs.x-cameraX, obs.y-cameraY, obs.width, obs.height);
      } else {
        // Canvas skull obstacle
        ctx.fillStyle = '#7b2d8b';
        ctx.fillRect(obs.x-cameraX, obs.y-cameraY, obs.width, obs.height);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font      = `bold ${Math.min(obs.width, obs.height) * 0.7}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('☠', obs.x-cameraX+obs.width/2, obs.y-cameraY+obs.height/2);
        ctx.textBaseline = 'alphabetic';
      }
    }

    // Monster obstacles
    for (const obss of obstacless) {
      if (imgObstacle.complete && imgObstacle.naturalWidth > 0) {
        ctx.drawImage(imgObstacle, obss.x-cameraX, obss.y-cameraY-25, 100, 100);
      } else {
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(obss.x-cameraX, obss.y-cameraY-25, 100, 100);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font      = 'bold 40px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('👾', obss.x-cameraX+50, obss.y-cameraY+25);
        ctx.textBaseline = 'alphabetic';
      }
    }

    // Reset gates
    for (const rg of resetGates) {
      ctx.fillStyle   = 'rgba(255,50,50,0.18)';
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth   = 2.5;
      ctx.setLineDash([6, 3]);
      ctx.fillRect  (rg.x-cameraX, rg.y-cameraY, rg.width, rg.height);
      ctx.strokeRect(rg.x-cameraX, rg.y-cameraY, rg.width, rg.height);
      ctx.setLineDash([]);
      ctx.fillStyle = '#ff4444';
      ctx.font      = `bold ${Math.min(rg.width, rg.height) * 0.5}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('↩', rg.x-cameraX+rg.width/2, rg.y-cameraY+rg.height/2);
      ctx.textBaseline = 'alphabetic';
    }

    // Gate
    for (const gbs of gate) {
      if (imgGate.complete && imgGate.naturalWidth > 0) {
        ctx.drawImage(imgGate, gbs.x-cameraX, gbs.y-cameraY, gbs.width, gbs.height);
      } else {
        drawGateCanvas(gbs.x-cameraX, gbs.y-cameraY, gbs.width, gbs.height);
      }
    }

    // Particles (behind ball)
    drawParticles();

    // Player ball
    if (imgBall.complete && imgBall.naturalWidth > 0) {
      ctx.save();
      ctx.translate(ball.x-cameraX, ball.y-cameraY);
      ctx.scale(ballScaleX, ballScaleY);
      ctx.drawImage(imgBall, -ball.radius, -ball.radius, ball.radius*2, ball.radius*2);
      ctx.restore();
    } else {
      drawBallCanvas(ball.x-cameraX, ball.y-cameraY, ball.radius);
    }
  }

  // ===========================
  // GAME LOOP
  // ===========================
  function loop() {
    if (!gameRunning) return;
    update();
    draw();
    anim = requestAnimationFrame(loop);
  }

  // ===========================
  // LEVEL DESIGN REFERENCE
  // ===========================
  // blocks:      { x, y, width, height }
  // obstacles:   { x, y, width, height, dx/dy, sx/sy }   moving hazard (kill)
  // obstacless:  { x, y, width, height, dx/dy, sx/sy }   monster hazard (kill, drawn 100×100)
  // mobstacles:  { x, y, width, height, dx/dy, sx/sy }   rideable moving platform
  // gate:        { x, y, width, height, mov:false }        finish goal
  // resetGates:  { x, y, width, height, startX, startY }  teleport ball back on touch
  // coins:       { x, y, radius, collected:false }
  // diamonds:    { x, y, radius, collected:false }
  // keys:        { id:'k1', x, y, radius, collected:false }  id unique k1-k10
  // jumpBlocks:  { x, y, width, height, boost }
  // airBlocks:   { x, y, width, height, forceX, forceY }
  // airBlockss:  same shape (fake — no visual glow, drawn green)
  // bombBlocks:  { x, y, width, height }                   kill on touch
  // bombBlockss: { x, y, width, height }                   sound only, no kill
  // showMsg("text", ms)   — show message board text
  // spawnDust(x, y)       — dust particles at position
  // spawnCoinPop(x, y)    — sparkle + +1 text at position
  // spawnExplosion(x, y)  — explosion particles
