<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DK GAMEZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>

    /* ── Global ── */
    * { touch-action: manipulation; }
    body { margin: 0; overflow: hidden; }

    canvas {
      background: #000;
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* ── HUD bar (top-left, shown during gameplay) ── */
    #hudBar {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      flex-direction: row;
      gap: 10px;
      z-index: 1500;
      user-select: none;
    }
    .hud-item {
      background: rgba(0,0,0,0.65);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }
    #coinHUD    { color: gold;    border: 2px solid gold;    }
    #diamondHUD { color: #00eeff; border: 2px solid #00eeff; }
    #keyHUD     { color: #ffaa00; border: 2px solid #ffaa00; }

    /* ── Exit button (shown during gameplay, top-right) ── */
    #exitBtn {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.7);
      color: #ff4444;
      border: 2px solid #ff4444;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1600;
      user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Shop button (shown during gameplay) ── */
    #shopBtn {
      display: none;
      position: absolute;
      top: 12px;
      right: 120px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 2px solid gold;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1600;
      user-select: none;
    }

    /* ── Message board ── */
    #msgBoard {
      display: none;
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      padding: 8px 22px;
      border-radius: 30px;
      border: 2px solid rgba(255,255,255,0.35);
      z-index: 1600;
      max-width: 80vw;
      text-align: center;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    /* ── Controls ── */
    #controls {
      display: none;
      position: absolute;
      width: 100%;
      bottom: 20px;
      justify-content: space-between;
      user-select: none;
      -webkit-user-select: none;
    }
    .left-controls  { display: flex; gap: 55px; padding-left: 65px; }
    .right-controls { display: flex; gap: 20px; padding-right: 45px; }
    #controls button {
      background-color: white;
      border: none;
      padding: 15px 30px;
      font-size: 25px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Rotate notice ── */
    #rotateNotice {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      color: #fff;
      font-size: 30px;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 9999;
      padding: 30px;
    }

    /* ── Main menu buttons ── */
    #startBtn {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      z-index: 2000;
      background-color: black;
      border: 2px solid white;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
    }
    #startBtn h1 {
      margin: 0;
      padding: 40px;
      border-radius: 50px;
      color: transparent;
      background: linear-gradient(132deg, violet, darkblue, purple);
      background-size: 200%;
      background-clip: text;
      animation: shine 1s linear infinite;
    }
    #lvlbtn {
      position: absolute;
      top: 60%; left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid white;
      border-radius: 30px;
      padding: 15px;
      font-size: 15px;
      z-index: 2000;
      background-color: black;
      cursor: pointer;
      user-select: none;
    }
    #lvlbtn h2 {
      margin: 0;
      background: linear-gradient(132deg, violet, darkblue, purple);
      background-size: 200%;
      background-clip: text;
      color: transparent;
      animation: shine 1s linear infinite;
    }
    @keyframes shine {
      from { background-position: -200% 0; }
      to   { background-position:  200% 0; }
    }

    /* ── Level menu ── */
    #levelMenu {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      border: 3px solid white;
      border-radius: 20px;
      padding: 30px;
      z-index: 3000;
      text-align: center;
    }
    .levelGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .levelBtn {
      width: 60px; height: 60px;
      font-size: 22px;
      border-radius: 10px;
      cursor: pointer;
    }

    /* ── Overlays (Game Over / You Win) ── */
    .centerOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 2000;
      user-select: none;
    }
    .overlay-box {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      color: white;
      padding: 36px 50px;
      font-size: 30px;
      border: 3px solid white;
      border-radius: 16px;
      text-align: center;
      min-width: 260px;
    }
    .overlay-box .sub {
      font-size: 16px;
      color: gold;
      margin-top: 10px;
    }
    /* ── Overlay action buttons ── */
    .overlay-btn-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 22px;
    }
    .overlay-btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;

      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-retry { background: gold;    color: black; }
    .btn-quit  { background: #ff4444; color: white; }
    .btn-next  { background: #22cc55; color: white; }
    .btn-menu  { background: #555;    color: white; }

    /* ── Settings / About ── */
    #settingsBtn {
      position: absolute;
      top: 60%; left: 75%;
      transform: translate(-50%, -50%);
      padding: 1px;
      border-radius: 20px;
      background: black;
      color: red;
      border: 1px solid white;
      cursor: pointer;
      z-index: 2000;
    }
    #settingsMenu {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      border: 3px solid white;
      border-radius: 20px;
      padding: 30px;
      z-index: 5000;
      min-width: 300px;
    }
    .settingItem {
      margin: 20px 0;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }
    #aboutBtn {
      position: absolute;
      top: 60%; left: 27%;
      transform: translate(-50%, -50%);
      padding: 5px;
      border-radius: 20px;
      background: black;
      color: red;
      border: 1px solid white;
      cursor: pointer;
      z-index: 2000;
    }
    #aboutMenu {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      border: 3px solid white;
      border-radius: 30px;
      padding: 30px;
      text-align: center;
      z-index: 5000;
      width: 350px;
    }
    #closeAbout   { margin-top: 20px; padding: 10px 20px; }
    #closeSettings,
    #resetProgress { width: 100%; margin-top: 15px; padding: 10px; }

    /* ── Shop overlay ── */
    #shopOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      z-index: 4000;
      overflow-y: auto;
    }
    .shop-inner {
      max-width: 420px;
      margin: 40px auto;
      background: #111;
      border: 2px solid gold;
      border-radius: 20px;
      padding: 24px;
      color: #fff;
    }
    .shop-inner h2 { text-align: center; color: gold; margin: 0 0 6px; }
    .shop-balances { text-align: center; margin-bottom: 16px; font-size: 15px; }
    .shop-close-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: gold;
      color: black;
      font-size: 16px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

  </style>
</head>
<body>

<!-- Canvas -->
<canvas id="gameCanvas"></canvas>

<!-- Sounds -->
<audio id="jumpSound"    src="jump.mp3"    preload="auto"></audio>
<audio id="winSound"     src="won.mp3"     preload="auto"></audio>
<audio id="loseSound"    src="lose.mp3"    preload="auto"></audio>
<audio id="coinSound"    src="coin.mp3"    preload="auto"></audio>
<audio id="bounceSound"  src="bounce.mp3"  preload="auto"></audio>
<audio id="bombSound"    src="bomb.mp3"    preload="auto"></audio>
<audio id="airSound"     src="air.mp3"     preload="auto"></audio>
<audio id="mobSound"     src="mob.mp3"     preload="auto"></audio>
<audio id="diamondSound" src="diamond.mp3" preload="auto"></audio>
<audio id="keySound"     src="key.mp3"     preload="auto"></audio>

<!-- HUD -->
<div id="hudBar">
  <div class="hud-item" id="coinHUD">🪙 0</div>
  <div class="hud-item" id="diamondHUD">💎 0</div>
  <div class="hud-item" id="keyHUD">🗝️ 0/10</div>
</div>

<!-- Exit button (gameplay) -->
<button id="exitBtn">✖ Exit</button>

<!-- Shop button (gameplay) -->
<button id="shopBtn">🛒 Shop</button>

<!-- Message board -->
<div id="msgBoard"></div>

<!-- Controls -->
<div id="controls">
  <div class="left-controls">
    <button id="leftBtn">◀️</button>
    <button id="rightBtn">▶️</button>
  </div>
  <div class="right-controls">
    <button id="upBtn">⬆️</button>
  </div>
</div>

<!-- Rotate notice -->
<div id="rotateNotice">
  📱 Please rotate your device to <strong>landscape</strong> mode to play!
</div>

<!-- Main menu -->
<div><button id="startBtn"><h1>Start Game</h1></button></div>
<div><button id="lvlbtn"><h2>LEVELS</h2></button></div>

<div id="levelMenu">
  <h2>Select Level</h2>
  <div class="levelGrid">
    <button class="levelBtn">1</button>
    <button class="levelBtn">2</button>
    <button class="levelBtn">3</button>
    <button class="levelBtn">4</button>
    <button class="levelBtn">5</button>
    <button class="levelBtn">6</button>
    <button class="levelBtn">7</button>
    <button class="levelBtn">8</button>
    <button class="levelBtn">9</button>
    <button class="levelBtn">10</button>
  </div>
  <button id="closeLevels">Close</button>
</div>

<div><button id="settingsBtn"><h2>SETTINGS</h2></button></div>
<div id="settingsMenu">
  <h2>⚙️ SETTINGS</h2>
  <div class="settingItem">
    <label>🔊 Sound Effects</label>
    <input type="checkbox" id="soundToggle" checked>
  </div>
  <div class="settingItem">
    <label>📳 Vibration</label>
    <input type="checkbox" id="vibrationToggle" checked>
  </div>
  <div class="settingItem">
    <label>🎮 Control Size</label>
    <select id="controlSize">
      <option value="small">Small</option>
      <option value="medium" selected>Medium</option>
      <option value="large">Large</option>
    </select>
  </div>
  <div class="settingItem">
    <label>🌗 Theme</label>
    <select id="themeSelect">
      <option value="dark" selected>Dark</option>
      <option value="light">Light</option>
    </select>
  </div>
  <button id="resetProgress">Reset Progress</button>
  <button id="closeSettings">Close</button>
</div>

<div><button id="aboutBtn"><h2>ABOUT</h2></button></div>
<div id="aboutMenu">
  <h2>🎮 DK GAMEZ</h2>
  <p>Welcome to DK GAMEZ!</p>
  <p>A platform adventure game created by DK.</p>
  <p>Avoid obstacles, jump across platforms, and reach the goal to win.</p>
  <p>Version 1.0</p>
  <button id="closeAbout">Close</button>
</div>

<!-- Shop overlay -->
<div id="shopOverlay">
  <div class="shop-inner">
    <h2>🛒 SHOP</h2>
    <div class="shop-balances">
      <span id="shopCoinDisplay"    style="color:gold;">🪙 0</span>
      &nbsp;&nbsp;
      <span id="shopDiamondDisplay" style="color:#00eeff;">💎 0</span>
    </div>
    <div id="shopItemList"></div>
    <button class="shop-close-btn"
      onclick="document.getElementById('shopOverlay').style.display='none'">
      ✖ Close Shop
    </button>
  </div>
</div>

<!-- Game Over overlay — Retry + Quit buttons, no full-overlay tap -->
<div id="playAgainOverlay" class="centerOverlay">
  <div class="overlay-box">
    💀 Game Over
    <div class="sub" id="loseCoinsMsg"></div>
    <div class="overlay-btn-row">
      <button class="overlay-btn btn-retry" id="retryBtn">🔄 Retry</button>
      <button class="overlay-btn btn-quit"  id="quitBtn">🏠 Quit</button>
    </div>
  </div>
</div>

<!-- You Win overlay — Continue + Main Menu buttons -->
<div id="youWinOverlay" class="centerOverlay">
  <div class="overlay-box">
    🏆 You Win!
    <div class="sub" id="winCoinsMsg"></div>
    <div class="overlay-btn-row">
      <button class="overlay-btn btn-next" id="continueBtn">▶ Continue</button>
      <button class="overlay-btn btn-menu" id="winMenuBtn">🏠 Menu</button>
    </div>
  </div>
</div>

<script>
  // ===========================
  // CANVAS — responsive
  // ===========================
  const canvas = document.getElementById('gameCanvas');
  const ctx    = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize',            resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);

  // ===========================
  // SOUNDS
  // ===========================
  const jumpSound    = document.getElementById('jumpSound');
  const winSound     = document.getElementById('winSound');
  const loseSound    = document.getElementById('loseSound');
  const coinSound    = document.getElementById('coinSound');
  const bounceSound  = document.getElementById('bounceSound');
  const bombSound    = document.getElementById('bombSound');
  const airSound     = document.getElementById('airSound');
  const mobSound     = document.getElementById('mobSound');
  const diamondSound = document.getElementById('diamondSound');
  const keySound     = document.getElementById('keySound');

  const soundToggle     = document.getElementById('soundToggle');
  const vibrationToggle = document.getElementById('vibrationToggle');
  const themeSelect     = document.getElementById('themeSelect');
  const settingsMenu    = document.getElementById('settingsMenu');

  function playSound(audio) {
    if (!soundToggle.checked) return;
    try { audio.currentTime = 0; audio.play(); } catch (e) {}
  }

  // ===========================
  // IMAGES  (fallback to solid colour when file is missing)
  // ===========================
  const imgBg        = new Image(); imgBg.src        = 'sky.jpg';
  const imgBall      = new Image(); imgBall.src      = 'ball.png';
  const imgBlock     = new Image(); imgBlock.src     = 'grass.png';
  const imgMob       = new Image(); imgMob.src       = 'mob.png';
  const imgObstacle  = new Image(); imgObstacle.src  = 'block.png';
  const imgObstacles = new Image(); imgObstacles.src = 'grass.png';
  const imgGate      = new Image(); imgGate.src      = 'door.png';
  const imgCoin      = new Image(); imgCoin.src      = 'Coin.png';
  const imgDiamond   = new Image(); imgDiamond.src   = 'diamond.png';
  const imgKey       = new Image(); imgKey.src       = 'key.png';
  const imgJump      = new Image(); imgJump.src      = 'jumppad.png';
  const imgAir       = new Image(); imgAir.src       = 'fan.png';
  const imgBomb      = new Image(); imgBomb.src      = 'bomb.png';

  function drawImg(img, color, x, y, w, h) {
    if (img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x, y, w, h);
    } else {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }
  }

  // ===========================
  // PLAYER
  // ===========================
  ball      = { x: 830, y: 630, radius: 10, dx: 0, dy: 0, onGround: false };
  gravity   = 0.5;
  jumpPower = -10;

  // ===========================
  // GAME VARIABLES
  // ===========================
  let selectedLevel = 1;
  let cameraX = 0, cameraY = 0;
  let anim;
  let gameRunning = false;

  // ===========================
  // LEVEL DATA ARRAYS
  // ===========================
  let blocks     = [], obstacles  = [], obstacless  = [];
  let mobstacles = [], gate       = [];
  let coins      = [], diamonds   = [], keys        = [];
  let jumpBlocks = [], airBlocks  = [], airBlockss  = [];
  let bombBlocks = [], bombBlockss= []; fgate =[];

  // ===========================
  // PERSISTENT STORAGE
  // ===========================
  let coinsCollected    = 0;
  let totalCoins        = Number(localStorage.getItem('totalCoins'))    || 0;
  let diamondsCollected = 0;
  let totalDiamonds     = Number(localStorage.getItem('totalDiamonds')) || 0;
  let collectedKeyIds   = JSON.parse(localStorage.getItem('collectedKeyIds') || '[]');
  let totalKeys         = collectedKeyIds.length;
//fake
let spawnX = 830;
let spawnY = 630;
  // ===========================
  // HUD
  // ===========================
  const hudBar     = document.getElementById('hudBar');
  const coinHUD    = document.getElementById('coinHUD');
  const diamondHUD = document.getElementById('diamondHUD');
  const keyHUD     = document.getElementById('keyHUD');
  const msgBoard   = document.getElementById('msgBoard');
  //



  function updateHUDs() {
    coinHUD.textContent    = '🪙 '  + totalCoins;
    diamondHUD.textContent = '💎 '  + totalDiamonds;
    keyHUD.textContent     = '🗝️ ' + totalKeys + '/10';
  }
  updateHUDs();

  // ===========================
  // MESSAGE BOARD
  // ===========================
  let msgTimer = null;
  function showMsg(text, duration) {
    msgBoard.textContent    = text;
    msgBoard.style.display  = 'block';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msgBoard.style.display = 'none'; }, duration || 3000);
  }

  // ===========================
  // SHOP
  // ===========================
  const shopItems = [
    { id: 'shield', name: '🛡️ Shield',      desc: 'Free hit for 1 minute',   cost: 300, type: 'coin'    },
    { id: 'boots',  name: '👟 Speed Boots', desc: 'Move 1.5× faster',        cost: 100, type: 'coin'    },
    { id: 'spring', name: '🌀 Super Jump',  desc: 'Double jump height',       cost: 80,  type: 'coin'    },
    { id: 'magnet', name: '🧲 Coin Magnet', desc: 'Auto-collect nearby',      cost: 5,   type: 'coin'    },
    { id: 'heart',  name: '❤️ Extra Life',  desc: 'Respawn once',             cost: 8,   type: 'diamond' },
  ];

  function getOwned() {
    return JSON.parse(localStorage.getItem('ownedItems') || '[]');
  }

  function renderShop() {
    document.getElementById('shopCoinDisplay').textContent    = '🪙 ' + totalCoins;
    document.getElementById('shopDiamondDisplay').textContent = '💎 ' + totalDiamonds;

    const owned = getOwned();
    const list  = document.getElementById('shopItemList');
    list.innerHTML = '';

    for (const item of shopItems) {
      const isOwned  = owned.includes(item.id);
      const currency = item.type === 'coin' ? '🪙' : '💎';
      const balance  = item.type === 'coin' ? totalCoins : totalDiamonds;
      const canBuy   = !isOwned && balance >= item.cost;

      const row = document.createElement('div');
      row.style.cssText = `
        display:flex; justify-content:space-between; align-items:center;
        background:#1a1a1a; border:1px solid #333; border-radius:12px;
        padding:12px 14px; margin-bottom:10px; gap:10px;`;

      row.innerHTML = `
        <div>
          <div style="font-size:17px;font-weight:bold;">${item.name}</div>
          <div style="font-size:13px;color:#aaa;">${item.desc}</div>
        </div>
        <button data-id="${item.id}" data-cost="${item.cost}" data-type="${item.type}"
          style="padding:8px 16px;border-radius:8px;border:none;
                 cursor:${canBuy ? 'pointer' : 'default'};
                 font-weight:bold;font-size:14px;white-space:nowrap;
                 background:${isOwned ? '#444' : canBuy ? 'gold' : '#333'};
                 color:${isOwned ? '#aaa' : canBuy ? 'black' : '#666'};">
          ${isOwned ? '✅ Owned' : currency + ' ' + item.cost}
        </button>`;

      list.appendChild(row);
    }

    list.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id   = btn.dataset.id;
        const cost = Number(btn.dataset.cost);
        const type = btn.dataset.type;
        const owned = getOwned();
        if (owned.includes(id)) return;

        if (type === 'coin' && totalCoins >= cost) {
          totalCoins -= cost;
          localStorage.setItem('totalCoins', totalCoins);
        } else if (type === 'diamond' && totalDiamonds >= cost) {
          totalDiamonds -= cost;
          localStorage.setItem('totalDiamonds', totalDiamonds);
        } else {
          showMsg('❌ Not enough ' + (type === 'coin' ? '🪙 coins' : '💎 diamonds') + '!', 2000);
          return;
        }

        owned.push(id);
        localStorage.setItem('ownedItems', JSON.stringify(owned));
        updateHUDs();
        renderShop();
        showMsg('✅ ' + shopItems.find(i => i.id === id).name + ' purchased!', 2000);
      });
    });
  }

  document.getElementById('shopBtn').addEventListener('click', () => {
    renderShop();
    document.getElementById('shopOverlay').style.display = 'block';
  });

  // ===========================
  // SETTINGS
  // ===========================
  function requestFull() {
    if (document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen();
  }

  document.getElementById('aboutBtn').addEventListener('click',   () => document.getElementById('aboutMenu').style.display = 'block');
  document.getElementById('closeAbout').addEventListener('click', () => document.getElementById('aboutMenu').style.display = 'none');
  document.getElementById('settingsBtn').addEventListener('click',   () => settingsMenu.style.display = 'block');
  document.getElementById('closeSettings').addEventListener('click', () => settingsMenu.style.display = 'none');

  document.getElementById('controlSize').addEventListener('change', e => {
    const sizes = { small: '10px 20px', medium: '15px 30px', large: '25px 45px' };

  // ===========================
  // CONTROLS
  // ===========================
  function setupControls() {
    const leftBtn  = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    const upBtn    = document.getElementById('upBtn');

    let leftCount = 0, rightCount = 0;
    let jumpBuffered  = false;
    let jumpBufferTimer = null;

    function updateMovement() {
      if      (leftCount > 0 && rightCount === 0) ball.dx = -3;
      else if (rightCount > 0 && leftCount  === 0) ball.dx =  3;
      else                                          ball.dx =  0;
    }

    function tryJump() {
      if (ball.onGround) {
        ball.dy       = jumpPower;
        ball.onGround = false;
        playSound(jumpSound);
        jumpBuffered  = false;
      } else {
        // Buffer: fire instantly when ball lands within 120 ms
        jumpBuffered = true;
        clearTimeout(jumpBufferTimer);
        jumpBufferTimer = setTimeout(() => { jumpBuffered = false; }, 120);
      }
    }

    // Called in update() after onGround is set true
    window._checkBufferedJump = function () {
      if (jumpBuffered && ball.onGround) {
        ball.dy       = jumpPower;
        ball.onGround = false;
        playSound(jumpSound);
        jumpBuffered  = false;
        clearTimeout(jumpBufferTimer);
      }
    };

    function bindBtn(btn, onDown, onUp) {
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        onDown();
      });
      btn.addEventListener('pointerup',     e => { e.preventDefault(); onUp(); });
      btn.addEventListener('pointercancel', e => { e.preventDefault(); onUp(); });
      btn.addEventListener('pointerleave',  e => {
        if (!btn.hasPointerCapture(e.pointerId)) onUp();
      });
    }

    bindBtn(leftBtn,
      () => { leftCount++;  updateMovement(); },
      () => { leftCount  = Math.max(0, leftCount  - 1); updateMovement(); }
    );
    bindBtn(rightBtn,
      () => { rightCount++;  updateMovement(); },
      () => { rightCount = Math.max(0, rightCount - 1); updateMovement(); }
    );
    bindBtn(upBtn, () => tryJump(), () => {});

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight')              { rightCount = 1; updateMovement(); }
      if (e.key === 'ArrowLeft')               { leftCount  = 1; updateMovement(); }
      if (e.key === 'ArrowUp' || e.key === ' ') tryJump();
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowRight') { rightCount = 0; updateMovement(); }
      if (e.key === 'ArrowLeft')  { leftCount  = 0; updateMovement(); }
    });
  }
//
//grow
//  LEVEL 4
const growRate    = 0.5;   // px per second
const maxRadius   = 40;    // max size
const baseRadius  = 10;    // starting size
let lastGrowTime  = performance.now();

function growBall() {
  // Only grow on level 4
  if (selectedLevel !== 4) return;

  const now     = performance.now();
  const elapsed = (now - lastGrowTime) / 1000;

  if (elapsed >= 1) {
    if (ball.radius < maxRadius) {
      ball.radius += growRate;
    }
    lastGrowTime = now;
  }
}
  // ===========================
  // UPDATE
  // ===========================
  function update() {
    ball.x  += ball.dx;
    ball.y  += ball.dy;
    ball.dy += gravity;
    ball.onGround = false;

    cameraX = ball.x - canvas.width  / 2;
    cameraY = ball.y - canvas.height / 2;

growBall();  
  ball.x += ball.dx;

    // Solid blocks
    for (const block of blocks) {
      const cx = Math.max(block.x, Math.min(ball.x, block.x + block.width));
      const cy = Math.max(block.y, Math.min(ball.y, block.y + block.height));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy < ball.radius * ball.radius) {
        const ox = ball.radius - Math.abs(dx);
        const oy = ball.radius - Math.abs(dy);
        if (ox < oy) {
          ball.x += dx > 0 ? ox : -ox;
          ball.dx = 0;
        } else {
          ball.y += dy > 0 ? oy : -oy;
          ball.dy = 0;
          if (dy < 0) { ball.onGround = true; window._checkBufferedJump(); }
        }
      }
    }


    // Moving platforms
    for (const mobs of mobstacles) {
      if (mobs.dx) { mobs.x += mobs.dx; if (mobs.x > mobs.sx+100 || mobs.x < mobs.sx-100) mobs.dx *= -1; }
      if (mobs.dy) { mobs.y += mobs.dy; if (mobs.y > mobs.sy+100 || mobs.y < mobs.sy-100) mobs.dy *= -1; }
      const cx = Math.max(mobs.x, Math.min(ball.x, mobs.x + mobs.width));
      const cy = Math.max(mobs.y, Math.min(ball.y, mobs.y + mobs.height));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy < ball.radius * ball.radius) {
        const ox = ball.radius - Math.abs(dx);
        const oy = ball.radius - Math.abs(dy);
        if (ox < oy) {
          ball.x += dx > 0 ? ox : -ox;
          ball.dx = 0;
        } else {
          ball.y += dy > 0 ? oy : -oy;
          ball.dy = 0;
          if (dy < 0) {
            ball.onGround = true;
            window._checkBufferedJump();
            if (mobs.dx) ball.x += mobs.dx;
            if (mobs.dy) ball.y += mobs.dy;
          }
        }
      }
    }

    // Coins
    for (const coin of coins) {
      if (coin.collected) continue;
      const dx = ball.x - coin.x, dy = ball.y - coin.y;
      if (Math.sqrt(dx*dx + dy*dy) < ball.radius + coin.radius) {
        coin.collected = true;
        coinsCollected++; totalCoins++;
        localStorage.setItem('totalCoins', totalCoins);
        updateHUDs();
        playSound(coinSound);
      }
    }

    // Diamonds
    for (const dia of diamonds) {
      if (dia.collected) continue;
      const dx = ball.x - dia.x, dy = ball.y - dia.y;
      if (Math.sqrt(dx*dx + dy*dy) < ball.radius + dia.radius) {
        dia.collected = true;
        diamondsCollected++; totalDiamonds++;
        localStorage.setItem('totalDiamonds', totalDiamonds);
        updateHUDs();
        playSound(diamondSound);
        showMsg('💎 Diamond collected!', 2000);
      }
    }

    // Keys
    for (const k of keys) {
      if (k.collected || collectedKeyIds.includes(k.id)) continue;
      const dx = ball.x - k.x, dy = ball.y - k.y;
      if (Math.sqrt(dx*dx + dy*dy) < ball.radius + k.radius) {
        k.collected = true;
        collectedKeyIds.push(k.id);
        totalKeys = collectedKeyIds.length;
        localStorage.setItem('collectedKeyIds', JSON.stringify(collectedKeyIds));
        updateHUDs();
        playSound(keySound);
        showMsg('🗝️ Key ' + totalKeys + '/10 found!', 2500);
      }
    }

    // Jump blocks
    for (const jb of jumpBlocks) {
      const cx = Math.max(jb.x, Math.min(ball.x, jb.x + jb.width));
      const cy = Math.max(jb.y, Math.min(ball.y, jb.y + jb.height));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy < ball.radius * ball.radius) {
        const ox = ball.radius - Math.abs(dx);
        const oy = ball.radius - Math.abs(dy);
        if (ox < oy) {
          ball.x += dx > 0 ? ox : -ox;
          ball.dx = 0;
        } else {
          ball.y += dy > 0 ? oy : -oy;
          if (dy < 0) { ball.dy = jumpPower * (jb.boost || 1.8); playSound(bounceSound); }
          else         ball.dy = 0;
        }
      }
    }

    // Air blocks
    for (const ab of [...airBlocks, ...airBlockss]) {
      if (ball.x+ball.radius > ab.x && ball.x-ball.radius < ab.x+ab.width &&
          ball.y+ball.radius > ab.y && ball.y-ball.radius < ab.y+ab.height) {
        ball.dx += ab.forceX || 0;
        ball.dy += ab.forceY || 0;
        ball.dx = Math.max(-8, Math.min(8, ball.dx));
        ball.dy = Math.max(-8, Math.min(8, ball.dy));
      }
    }

    // Bomb blocks (real — trigger lose)
    for (const bb of bombBlocks) {
      if (ball.x+ball.radius > bb.x && ball.x-ball.radius < bb.x+bb.width &&
          ball.y+ball.radius > bb.y && ball.y-ball.radius < bb.y+bb.height) {
        playSound(bombSound);
        triggerLose();
      }
    }

    // Bomb blocks (fake — sound only, no lose)
    for (const bbb of bombBlockss) {
      if (ball.x+ball.radius > bbb.x && ball.x-ball.radius < bbb.x+bbb.width &&
          ball.y+ball.radius > bbb.y && ball.y-ball.radius < bbb.y+bbb.height) {
        playSound(bombSound);
      }
    }

    // Obstacles (kill)
    for (const obs of obstacles) {
      if (obs.dx) { obs.x += obs.dx; if (obs.x > obs.sx+100 || obs.x < obs.sx-100) obs.dx *= -1; }
      if (obs.dy) { obs.y += obs.dy; if (obs.y > obs.sy+100 || obs.y < obs.sy-100) obs.dy *= -1; }
      if (ball.x+ball.radius > obs.x && ball.x-ball.radius < obs.x+obs.width &&
          ball.y+ball.radius > obs.y && ball.y-ball.radius < obs.y+obs.height) {
        triggerLose();
      }
    }

    // Monster obstacles (kill)
    for (const obss of obstacless) {
      if (obss.dx) { obss.x += obss.dx; if (obss.x > obss.sx+9000 || obss.x < obss.sx-9000) obss.dx *= -1; }
      if (obss.dy) { obss.y += obss.dy; if (obss.y > obss.sy+9000|| obss.y < obss.sy-9000) obss.dy *= -1; }
      if (ball.x+ball.radius > obss.x && ball.x-ball.radius < obss.x+obss.width &&
          ball.y+ball.radius > obss.y && ball.y-ball.radius < obss.y+obss.height) {
        triggerLose();
      }
    }

    // Gate (win)
    for (const gbs of gate) {
      if (ball.x+ball.radius > gbs.x && ball.x-ball.radius < gbs.x+gbs.width &&
          ball.y+ball.radius > gbs.y && ball.y-ball.radius < gbs.y+gbs.width && !gbs.mov) {
        triggerWin();
      }
    }
  }
   // Gate (win)
    for (const fgbs of fgate) {
      if (ball.x+ball.radius > fgbs.x && ball.x-ball.radius < fgbs.x+fgbs.width &&
          ball.y+ball.radius > fgbs.y && ball.y-ball.radius < fgbs.y+fgbs.width && !fgbs.mov) {
            if(fgbs!=mov){
         fgbs.x = 830;
         fgbs.y = 630;
         fgbs.mov = true;
      }}
      else{
        triggerWin();
      }

  // ===========================
  // DRAW
  // ===========================
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    if (imgBg.complete && imgBg.naturalWidth > 0)
      ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);

    // Solid blocks
    for (const b of blocks)
      drawImg(imgBlock, 'green', b.x-cameraX, b.y-cameraY, b.width, b.height);

    // Moving platforms
    for (const m of mobstacles)
      drawImg(imgMob, 'gray', m.x-cameraX, m.y-cameraY, m.width, m.height);

    // Jump blocks
    for (const jb of jumpBlocks) {
      if (imgJump.complete && imgJump.naturalWidth > 0) {
        ctx.drawImage(imgJump, jb.x-cameraX, jb.y-cameraY, jb.width, jb.height);
      } else {
        ctx.fillStyle = 'orange';
        ctx.fillRect(jb.x-cameraX, jb.y-cameraY, jb.width, jb.height);
        ctx.fillStyle = 'yellow';
        ctx.fillRect(jb.x-cameraX, jb.y-cameraY, jb.width, 4);
      }
    }

    // Air blocks
    for (const ab of airBlocks) {
      if (imgAir.complete && imgAir.naturalWidth > 0) {
        ctx.drawImage(imgAir, ab.x-cameraX, ab.y-cameraY, ab.width, ab.height);
      } else {
        ctx.fillStyle = 'rgba(0,255,255,0.4)';
        ctx.fillRect(ab.x-cameraX, ab.y-cameraY, ab.width, ab.height);
      }
    }

    // Fake air blocks (drawn as green blocks)
    for (const abb of airBlockss) {
      if (imgAir.complete && imgAir.naturalWidth > 0) {
        ctx.drawImage(imgAir, abb.x-cameraX, abb.y-cameraY, abb.width, abb.height);
      } else {
        ctx.fillStyle = 'green';
        ctx.fillRect(abb.x-cameraX, abb.y-cameraY, abb.width, abb.height);
      }
    }

    // Bomb blocks (real)
    for (const bb of [...bombBlocks, ...bombBlockss]) {
      if (imgBomb.complete && imgBomb.naturalWidth > 0) {
        ctx.drawImage(imgBomb, bb.x-cameraX, bb.y-cameraY, bb.width, bb.height);
      } else {
        ctx.fillStyle = 'darkred';
        ctx.fillRect(bb.x-cameraX, bb.y-cameraY, bb.width, bb.height);
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(bb.x-cameraX+bb.width/2, bb.y-cameraY+bb.height/2,
                Math.min(bb.width, bb.height)/3, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // Coins
    for (const coin of coins) {
      if (coin.collected) continue;
      if (imgCoin.complete && imgCoin.naturalWidth > 0) {
        ctx.drawImage(imgCoin,
          coin.x-cameraX-coin.radius, coin.y-cameraY-coin.radius,
          coin.radius*2, coin.radius*2);
      } else {
        ctx.fillStyle = 'gold';
        ctx.beginPath();
        ctx.arc(coin.x-cameraX, coin.y-cameraY, coin.radius, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // Diamonds
    for (const dia of diamonds) {
      if (dia.collected) continue;
      if (imgDiamond.complete && imgDiamond.naturalWidth > 0) {
        ctx.drawImage(imgDiamond,
          dia.x-cameraX-dia.radius, dia.y-cameraY-dia.radius,
          dia.radius*2, dia.radius*2);
      } else {
        const x = dia.x-cameraX, y = dia.y-cameraY, r = dia.radius;
        ctx.fillStyle = '#00eeff';
        ctx.beginPath();
        ctx.moveTo(x, y-r); ctx.lineTo(x+r, y);
        ctx.lineTo(x, y+r); ctx.lineTo(x-r, y);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
      }
    }

    // Keys
    for (const k of keys) {
      if (k.collected || collectedKeyIds.includes(k.id)) continue;
      if (imgKey.complete && imgKey.naturalWidth > 0) {
        ctx.drawImage(imgKey,
          k.x-cameraX-k.radius, k.y-cameraY-k.radius,
          k.radius*2, k.radius*2);
      } else {
        const x = k.x-cameraX, y = k.y-cameraY, r = k.radius;
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath(); ctx.arc(x, y-r*0.3, r*0.55, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(x-r*0.12, y, r*0.25, r*0.9);
        ctx.fillRect(x, y+r*0.3, r*0.4,  r*0.18);
        ctx.fillRect(x, y+r*0.6, r*0.35, r*0.18);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y-r*0.3, r*0.55, 0, Math.PI*2); ctx.stroke();
      }
    }

    // Obstacles
    for (const obs of obstacles)
      drawImg(imgObstacles, 'purple', obs.x-cameraX, obs.y-cameraY, obs.width, obs.height);

    // Monster obstacles
    for (const obss of obstacless)
      drawImg(imgObstacle, 'red', obss.x-cameraX, obss.y-cameraY-25, 100, 100);

    // Gate and fake gate
    for (const gbs of gate)
      drawImg(imgGate, 'gold', gbs.x-cameraX, gbs.y-cameraY, gbs.width, gbs.height);
     for (const fgbs of fgate)
      drawImg(imgGate, 'gold', fgbs.x-cameraX, fgbs.y-cameraY, fgbs.width, fgbs.height);


    // Player
    if (imgBall.complete && imgBall.naturalWidth > 0) {
      ctx.drawImage(imgBall,
        ball.x-cameraX-ball.radius, ball.y-cameraY-ball.radius,
        ball.radius*2, ball.radius*2);
    } else {
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(ball.x-cameraX, ball.y-cameraY, ball.radius, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // ===========================
  // GAME LOOP
  // ===========================
  function loop() {
    if (!gameRunning) return;
    update();
    draw();
    anim = requestAnimationFrame(loop);
  }

  // ===========================
  // LEVEL DESIGN REFERENCE
  // ===========================
  // blocks:      { x, y, width, height }                       solid platform
  // obstacles:   { x, y, width, height, dx/dy, sx/sy }         moving hazard (kill)
  // obstacless:  { x, y, width, height, dx/dy, sx/sy }         monster hazard (kill)
  // mobstacles:  { x, y, width, height, dx/dy, sx/sy }         rideable moving platform
  // gate:        { x, y, width, height, mov:false }             finish goal
  // coins:       { x, y, radius, collected:false }              🪙 coin
  // diamonds:    { x, y, radius, collected:false }              💎 diamond
  // keys:        { id:'k1', x, y, radius, collected:false }     🗝️ key  (id unique k1-k10)
  // jumpBlocks:  { x, y, width, height, boost }                 bounce pad
  // airBlocks:   { x, y, width, height, forceX, forceY }        wind zone
  // airBlockss:  same as airBlocks (invisible/fake, drawn green)
  // bombBlocks:  { x, y, width, height }                        bomb (kill)
  // bombBlockss: { x, y, width, height }                        fake bomb (sound only)
  // showMsg("text", ms)  — display board message during gameplay

  // ===========================
  // LEVEL LOADER
  // ===========================
  function loadLevel(level) {
    // Reset run state
    coinsCollected    = 0;
    diamondsCollected = 0;
    coins      = []; diamonds  = []; keys       = [];
    jumpBlocks = []; airBlocks = []; airBlockss = [];
    bombBlocks = []; bombBlockss = [];
    obstacless = []; 
     //grow
      ball.radius  = baseRadius;
      lastGrowTime = performance.now();

    // ── LEVEL 1 ──
    if (level === 1) {
      ball = { x:1650, y:630, radius:10, dx:0, dy:0, onGround:false };
      gravity = 0.5; jumpPower = -12;
      blocks = [
        { x:30,    y:630,  width:5500, height:1000 },
        { x:-1300, y:830,  width:5500, height:1000 },
        { x:1200,  y:30,   width:1000, height:500  },
        { x:1700,  y:500,  width:500,  height:500  },
        { x:1800,  y:1600, width:1001, height:200  },
        { x:-50,   y:680,  width:100,  height:70   },
        { x:-250,  y:680,  width:100,  height:20   },
        { x:-460,  y:680,  width:100,  height:20   },
        { x:-650,  y:680,  width:100,  height:20   },
