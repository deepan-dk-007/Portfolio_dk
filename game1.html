<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DK GAMEZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      background: #222;
      display: block;
      height: 100vh;
      width: 100vw;
    }

    #controls {
      position: absolute;
      width: 100%;
      bottom: 20px;
      display: flex;
      justify-content: space-between;

      user-select: none;
      -webkit-user-select: none;
    }

    .left-controls {
      display: flex;
      gap: 55px;
      padding-left: 65px;
    }

    .right-controls {
      display: flex;
      gap: 20px;
      padding-right: 45px;
    }

#controls button {
  background-color: white;
  border: none;
  padding: 15px 30px;
  font-size: 25px;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}

    #rotateNotice {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      color: #fff;
      font-size: 30px;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 9999;
      padding: 30px;
    }

    /* Coin HUD - shown during gameplay */
    #coinHUD {
      display: none;
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: gold;
      font-size: 22px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid gold;
      z-index: 1500;
      user-select: none;
    }

    /* Start Game button - fixed the absurd padding that was covering the screen */
    #startBtn {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      z-index: 2000;
      background-color: black;
      border: 2px solid white;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
    }

    #startBtn h1 {
      margin: 0;
      padding: 40px;
      border-radius: 50px;
      color: transparent;
      background: linear-gradient(132deg, violet, darkblue, purple);
      background-size: 200%;
      background-clip: text;
      animation: shine 1s linear infinite;
    }

    #lvlbtn {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid white;
      border-radius: 30px;
      padding: 15px;
      font-size: 15px;
      z-index: 2000;
      background-color: black;
      cursor: pointer;
      user-select: none;
    }

    #lvlbtn h2 {
      margin: 0;
      background: linear-gradient(132deg, violet, darkblue, purple);
      background-size: 200%;
      background-clip: text;
      color: transparent;
      animation: shine 1s linear infinite;
    }

    @keyframes shine {
      from { background-position: -200% 0; }
      to { background-position: 200% 0; }
    }

    #levelMenu {
      display: none;

      position: fixed;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      background: black;
      color: white;
      border: 3px solid white;
      border-radius: 20px;

      padding: 30px;
      z-index: 3000;

      text-align: center;
    }

    .levelGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    .levelBtn {
      width: 60px;
      height: 60px;
      font-size: 22px;
      border-radius: 10px;
      cursor: pointer;
    }

    .centerOverlay {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      padding: 50px 100px;
      font-size: 30px;
      border: 3px solid white;
      border-radius: 10px;
      z-index: 1001;
      cursor: pointer;
      user-select: none;
    }

    #settingsBtn {
      position: absolute;
      top: 60%;
      left: 75%;
      transform: translate(-50%, -50%);
      padding: 15px 25px;
      border-radius: 10px;
      background: black;
      color: red;
      border: 1px solid white;
      cursor: pointer;
      z-index: 2000;
    }

    #settingsMenu {
      display: none;

      position: fixed;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      background: black;
      color: white;

      border: 3px solid white;
      border-radius: 20px;

      padding: 30px;

      z-index: 5000;

      min-width: 300px;
    }

    .settingItem {
      margin: 20px 0;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    #aboutBtn {
      position: absolute;
      top: 60%;
      left: 27%;
      transform: translate(-50%, -50%);
      padding: 15px 25px;
      border-radius: 10px;
      background: black;
      color: red;
      border: 1px solid white;
      cursor: pointer;
      z-index: 2000;
    }

    #aboutMenu {
      display: none;

      position: fixed;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      background: black;
      color: white;

      border: 3px solid white;
      border-radius: 20px;

      padding: 30px;

      text-align: center;

      z-index: 5000;

      width: 350px;
    }

    #closeAbout {
      margin-top: 20px;
      padding: 10px 20px;
    }

    #closeSettings,
    #resetProgress {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="900" height="1000"></canvas>

  <!-- COIN HUD -->
  <div id="coinHUD">🪙 0</div>

  <!-- CONTROLS -->
  <div id="controls">
    <div class="left-controls">
      <button id="leftBtn">◀️</button>
      <button id="rightBtn">▶️</button>
    </div>
    <div class="right-controls">
      <button id="upBtn">⬆️</button>
    </div>
  </div>

  <div id="rotateNotice">
    📱 Please rotate your device to <strong>landscape</strong> mode to play the game!
  </div>

  <!-- START GAME SECTION -->
  <div>
    <button id="startBtn"><h1>Start Game</h1></button>
  </div>

  <!-- LEVELS SECTION -->
  <div>
    <button id="lvlbtn"><h2>LEVELS</h2></button>
  </div>

  <div id="levelMenu">
    <h2>Select Level</h2>
    <div class="levelGrid">
      <button class="levelBtn">1</button>
      <button class="levelBtn">2</button>
      <button class="levelBtn">3</button>
      <button class="levelBtn">4</button>
      <button class="levelBtn">5</button>
      <button class="levelBtn">6</button>
      <button class="levelBtn">7</button>
      <button class="levelBtn">8</button>
      <button class="levelBtn">9</button>
      <button class="levelBtn">10</button>
    </div>
    <button id="closeLevels">Close</button>
  </div>

  <!-- SETTINGS SECTION -->
  <div>
    <button id="settingsBtn"><h2>SETTINGS</h2></button>
  </div>

  <div id="settingsMenu">
    <h2>⚙️ SETTINGS</h2>
    <div class="settingItem">
      <label>🔊 Sound Effects</label>
      <input type="checkbox" id="soundToggle" checked>
    </div>
    <div class="settingItem">
      <label>📳 Vibration</label>
      <input type="checkbox" id="vibrationToggle" checked>
    </div>
    <div class="settingItem">
      <label>🎮 Control Size</label>
      <select id="controlSize">
        <option value="small">Small</option>
        <option value="medium" selected>Medium</option>
        <option value="large">Large</option>
      </select>
    </div>
    <div class="settingItem">
      <label>🌗 Theme</label>
      <select id="themeSelect">
        <option value="dark" selected>Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <button id="resetProgress">Reset Progress</button>
    <button id="closeSettings">Close</button>
  </div>

  <!-- ABOUT SECTION -->
  <div>
    <button id="aboutBtn"><h2>ABOUT</h2></button>
  </div>

  <div id="aboutMenu">
    <h2>🎮 DK GAMEZ</h2>
    <p>Welcome to DK GAMEZ!</p>
    <p>A platform adventure game created by DK.</p>
    <p>Avoid obstacles, jump across platforms, and reach the goal to win.</p>
    <p>Version 1.0</p>
    <button id="closeAbout">Close</button>
  </div>

  <div id="playAgainOverlay" class="centerOverlay">Play Again</div>
  <div id="youWinOverlay" class="centerOverlay">You Win</div>
  <script>
    const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
     // =======================
    // CANVAS
    // =======================
    

    // =======================
    // PLAYER
    // =======================
    ball = {
      x: 830,
      y: 630,
      radius: 10,
      dx: 0,
      dy: 0,
      onGround: false
    };

    gravity = 0.5;
    jumpPower = -10;

    // =======================
    // GAME VARIABLES
    // =======================
    let selectedLevel = 1;
    let cameraX = 0;
    let cameraY = 0;
    let anim;

    // =======================
    // LEVEL DATA
    // =======================
    let blocks = [];
    let obstacles = [];
    let mobstacles = [];   // moving platforms (ride them)
    let gate = [];

    // =======================
    // NEW LEVEL-DESIGN ELEMENTS
    // =======================
    let coins = [];         // collectible coins
    let jumpBlocks = [];     // bounce pads - boost the ball's jump
    let airBlocks = [];      // wind / air-blow blocks - push the ball
    let bombBlocks = [];     // bomb blocks - hazard, ends the run on touch

    // =======================
    // COIN STORAGE (persists between sessions)
    // =======================
    let coinsCollected = 0; // coins collected in the current run
    let totalCoins = Number(localStorage.getItem("totalCoins")) || 0;

    const coinHUD = document.getElementById("coinHUD");

    function updateCoinHUD() {
      coinHUD.textContent = "🪙 " + totalCoins;
    }
    updateCoinHUD();

    // =======================
    // SETTINGS ELEMENTS
    // =======================
    const soundToggle = document.getElementById("soundToggle");
    const vibrationToggle = document.getElementById("vibrationToggle");
    const themeSelect = document.getElementById("themeSelect");

    // =======================
    // FULLSCREEN
    // =======================
    function requestFull() {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }
    }

    // =======================
    // ABOUT MENU
    // =======================
    const aboutBtn = document.getElementById("aboutBtn");
    const aboutMenu = document.getElementById("aboutMenu");
    const closeAbout = document.getElementById("closeAbout");

    aboutBtn.addEventListener("click", () => {
      aboutMenu.style.display = "block";
    });

    closeAbout.addEventListener("click", () => {
      aboutMenu.style.display = "none";
    });

    // =======================
    // SETTINGS MENU
    // =======================
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsMenu = document.getElementById("settingsMenu");
    const closeSettings = document.getElementById("closeSettings");

    settingsBtn.addEventListener("click", () => {
      settingsMenu.style.display = "block";
    });

    closeSettings.addEventListener("click", () => {
      settingsMenu.style.display = "none";
    });

    document.getElementById("controlSize").addEventListener("change", (e) => {
      let size = "15px 30px";

      if (e.target.value === "small") size = "10px 20px";
      if (e.target.value === "large") size = "25px 45px";

      document.querySelectorAll("#controls button").forEach(btn => {
        btn.style.padding = size;
      });
    });

    themeSelect.addEventListener("change", (e) => {
      if (e.target.value === "light") {
        document.body.style.background = "white";
        canvas.style.background = "#ddd";
      } else {
        document.body.style.background = "black";
        canvas.style.background = "#222";
      }

      localStorage.setItem("theme", e.target.value);
    });

    soundToggle.addEventListener("change", () => {
      localStorage.setItem("sound", soundToggle.checked);
    });

    vibrationToggle.addEventListener("change", () => {
      localStorage.setItem("vibration", vibrationToggle.checked);
    });

    document.getElementById("resetProgress").addEventListener("click", () => {
      localStorage.clear();
      location.reload();
    });

    // Restore saved settings on load
    window.addEventListener("load", () => {
      const savedSound = localStorage.getItem("sound");
      const savedVibration = localStorage.getItem("vibration");
      const savedTheme = localStorage.getItem("theme");

      if (savedSound !== null) soundToggle.checked = savedSound === "true";
      if (savedVibration !== null) vibrationToggle.checked = savedVibration === "true";

      if (savedTheme) {
        themeSelect.value = savedTheme;
        themeSelect.dispatchEvent(new Event("change"));
      }
    });

    // =======================
    // LEVEL SELECT MENU
    // =======================
    const levelMenu = document.getElementById("levelMenu");

    document.getElementById("lvlbtn").addEventListener("click", () => {
      levelMenu.style.display = "block";
    });

    document.getElementById("closeLevels").addEventListener("click", () => {
      levelMenu.style.display = "none";
    });

    document.querySelectorAll(".levelBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const level = Number(btn.innerText);

        // Levels 3-10 aren't built yet - show a Coming Soon message
        if (level > 2) {
          alert("🚧 Level " + level + " - Coming Soon!");
          return;
        }

        selectedLevel = level;
        loadLevel(level);
        levelMenu.style.display = 'none';
      });
    });

    // =======================
    // START GAME
    // =======================
    document.getElementById('startBtn').addEventListener('click', () => {

      loadLevel(selectedLevel);

      document.getElementById('startBtn').style.display = 'none';
      requestFull();
      document.getElementById('lvlbtn').style.display = 'none';
      document.getElementById('settingsBtn').style.display = 'none';
      document.getElementById('aboutBtn').style.display = 'none';

      // In case any menu was left open
      levelMenu.style.display = 'none';
      settingsMenu.style.display = 'none';
      aboutMenu.style.display = 'none';

      // Show the coin counter
      coinHUD.style.display = 'block';

      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');
      const upBtn = document.getElementById('upBtn');

      let leftPressed = false;
let rightPressed = false;

function updateMovement() {
  if (leftPressed && !rightPressed) ball.dx = -3;
  else if (rightPressed && !leftPressed) ball.dx = 3;
  else ball.dx = 0;
}

function tryJump() {
  if (ball.onGround) ball.dy = jumpPower;
}

function bindControl(btn, onDown, onUp) {
  const down = (e) => { e.preventDefault(); onDown(); };
  const up = (e) => { e.preventDefault(); onUp(); };

  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
}

bindControl(leftBtn, () => { leftPressed = true; updateMovement(); }, () => { leftPressed = false; updateMovement(); });
bindControl(rightBtn, () => { rightPressed = true; updateMovement(); }, () => { rightPressed = false; updateMovement(); });
bindControl(upBtn, () => tryJump(), () => {});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { rightPressed = true; updateMovement(); }
  if (e.key === 'ArrowLeft') { leftPressed = true; updateMovement(); }
  if (e.key === 'ArrowUp') tryJump();
});

document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowRight') { rightPressed = false; updateMovement(); }
  if (e.key === 'ArrowLeft') { leftPressed = false; updateMovement(); }
});

      playAgainOverlay = document.getElementById('playAgainOverlay');
      youWinOverlay = document.getElementById('youWinOverlay');

      playAgainOverlay.addEventListener('click', () => location.reload());
      youWinOverlay.addEventListener('click', () => location.reload());

      function update() {
        ball.x += ball.dx;
        ball.y += ball.dy;
        ball.dy += gravity;

        ball.onGround = false;

        // Update camera to follow ball
        cameraX = ball.x - canvas.width / 2;
        cameraY = ball.y - canvas.height / 2;

        for (const block of blocks) {
          const closestX = Math.max(block.x, Math.min(ball.x, block.x + block.width));
          const closestY = Math.max(block.y, Math.min(ball.y, block.y + block.height));
          const dx = ball.x - closestX;
          const dy = ball.y - closestY;

          if (dx * dx + dy * dy < ball.radius * ball.radius) {
            const overlapX = ball.radius - Math.abs(dx);
            const overlapY = ball.radius - Math.abs(dy);

            if (overlapX < overlapY) {
              ball.x += dx > 0 ? overlapX : -overlapX;
              ball.dx = 0;
            } else {
              ball.y += dy > 0 ? overlapY : -overlapY;
              ball.dy = 0;
              if (dy < 0) ball.onGround = true;
            }
          }
        }

        // Moving platforms
        for (const mobs of mobstacles) {

          if (mobs.dx) {
            mobs.x += mobs.dx;
            if (mobs.x > mobs.sx + 100) mobs.dx *= -1;
            if (mobs.x < mobs.sx - 100) mobs.dx *= -1;
          }

          if (mobs.dy) {
            mobs.y += mobs.dy;
            if (mobs.y > mobs.sy + 100) mobs.dy *= -1;
            if (mobs.y < mobs.sy - 100) mobs.dy *= -1;
          }

          const closestX = Math.max(mobs.x, Math.min(ball.x, mobs.x + mobs.width));
          const closestY = Math.max(mobs.y, Math.min(ball.y, mobs.y + mobs.height));
          const dx = ball.x - closestX;
          const dy = ball.y - closestY;

          if (dx * dx + dy * dy < ball.radius * ball.radius) {

            const overlapX = ball.radius - Math.abs(dx);
            const overlapY = ball.radius - Math.abs(dy);

            if (overlapX < overlapY) {
              ball.x += dx > 0 ? overlapX : -overlapX;
              ball.dx = 0;
            } else {
              ball.y += dy > 0 ? overlapY : -overlapY;
              ball.dy = 0;

              if (dy < 0) {
                ball.onGround = true;

                // Carry player with platform
                if (mobs.dx) ball.x += mobs.dx;
                if (mobs.dy) ball.y += mobs.dy;
              }
            }
          }
        }

        // Coins
        for (const coin of coins) {
          if (coin.collected) continue;

          const dx = ball.x - coin.x;
          const dy = ball.y - coin.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < ball.radius + coin.radius) {
            coin.collected = true;
            coinsCollected++;
            totalCoins++;
            localStorage.setItem("totalCoins", totalCoins);
            updateCoinHUD();
          }
        }

        // Jump blocks (bounce pads)
        for (const jb of jumpBlocks) {
          const closestX = Math.max(jb.x, Math.min(ball.x, jb.x + jb.width));
          const closestY = Math.max(jb.y, Math.min(ball.y, jb.y + jb.height));
          const dx = ball.x - closestX;
          const dy = ball.y - closestY;

          if (dx * dx + dy * dy < ball.radius * ball.radius) {
            const overlapX = ball.radius - Math.abs(dx);
            const overlapY = ball.radius - Math.abs(dy);

            if (overlapX < overlapY) {
              ball.x += dx > 0 ? overlapX : -overlapX;
              ball.dx = 0;
            } else {
              ball.y += dy > 0 ? overlapY : -overlapY;

              if (dy < 0) {
                // Landed on top - bounce!
                ball.dy = jumpPower * (jb.boost || 1.8);
              } else {
                ball.dy = 0;
              }
            }
          }
        }

        // Air-blow blocks (wind / fans)
        for (const ab of airBlocks) {
          if (
            ball.x + ball.radius > ab.x && ball.x - ball.radius < ab.x + ab.width &&
            ball.y + ball.radius > ab.y && ball.y - ball.radius < ab.y + ab.height
          ) {
            ball.dx += ab.forceX || 0;
            ball.dy += ab.forceY || 0;

            // Cap speed so it doesn't go out of control
            ball.dx = Math.max(-8, Math.min(8, ball.dx));
            ball.dy = Math.max(-8, Math.min(8, ball.dy));
          }
        }

        // Bomb blocks (hazard)
        for (const bb of bombBlocks) {
          if (
            ball.x + ball.radius > bb.x && ball.x - ball.radius < bb.x + bb.width &&
            ball.y + ball.radius > bb.y && ball.y - ball.radius < bb.y + bb.height
          ) {
            playAgainOverlay.style.display = 'block';
            cancelAnimationFrame(anim);
          }
        }

        for (const obs of obstacles) {
          if (obs.dx) {
            obs.x += obs.dx;
            if (obs.x > obs.sx + 100) obs.dx *= -1;
            if (obs.x < obs.sx - 100) obs.dx *= -1;
          }
          if (obs.dy) {
            obs.y += obs.dy;
            if (obs.y > obs.sy + 100) obs.dy *= -1;
            if (obs.y < obs.sy - 100) obs.dy *= -1;
          }

          if (
            ball.x + ball.radius > obs.x && ball.x - ball.radius < obs.x + obs.width &&
            ball.y + ball.radius > obs.y && ball.y - ball.radius < obs.y + obs.height
          ) {
            playAgainOverlay.style.display = 'block';
            cancelAnimationFrame(anim);
          }
        }

        for (const gbs of gate) {
          if (
            ball.x + ball.radius > gbs.x && ball.x - ball.radius < gbs.x + gbs.width &&
            ball.y + ball.radius > gbs.y && ball.y - ball.radius < gbs.y + gbs.width && !gbs.mov
          ) {
            gbs.x = 830; gbs.y = 610; gbs.mov = true;
          }
          if (
            ball.x + ball.radius > gbs.x && ball.x - ball.radius < gbs.x + gbs.width &&
            ball.y + ball.radius > gbs.y && ball.y - ball.radius < gbs.y + gbs.height
          ) {
            youWinOverlay.style.display = 'block';
            cancelAnimationFrame(anim);
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'black';
        for (const block of blocks) ctx.fillRect(block.x - cameraX, block.y - cameraY, block.width, block.height);

        ctx.fillStyle = 'green';
        for (const mobs of mobstacles) ctx.fillRect(mobs.x - cameraX, mobs.y - cameraY, mobs.width, mobs.height);

        // Jump blocks (bounce pads)
        for (const jb of jumpBlocks) {
          ctx.fillStyle = 'orange';
          ctx.fillRect(jb.x - cameraX, jb.y - cameraY, jb.width, jb.height);
          ctx.fillStyle = 'yellow';
          ctx.fillRect(jb.x - cameraX, jb.y - cameraY, jb.width, 4);
        }

        // Air-blow blocks (wind / fans)
        ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
        for (const ab of airBlocks) ctx.fillRect(ab.x - cameraX, ab.y - cameraY, ab.width, ab.height);

        // Bomb blocks
        for (const bb of bombBlocks) {
          ctx.fillStyle = 'darkred';
          ctx.fillRect(bb.x - cameraX, bb.y - cameraY, bb.width, bb.height);
          ctx.fillStyle = 'black';
          ctx.beginPath();
          ctx.arc(bb.x - cameraX + bb.width / 2, bb.y - cameraY + bb.height / 2, Math.min(bb.width, bb.height) / 3, 0, Math.PI * 2);
          ctx.fill();
        }

        // Coins
        ctx.fillStyle = 'gold';
        for (const coin of coins) {
          if (coin.collected) continue;
          ctx.beginPath();
          ctx.arc(coin.x - cameraX, coin.y - cameraY, coin.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = 'purple';
        for (const obs of obstacles) ctx.fillRect(obs.x - cameraX, obs.y - cameraY, obs.width, obs.height);

        ctx.fillStyle = 'gold';
        for (const gbs of gate) ctx.fillRect(gbs.x - cameraX, gbs.y - cameraY, gbs.width, gbs.height);

        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(ball.x - cameraX, ball.y - cameraY, ball.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop() {
        update();
        draw();
        anim = requestAnimationFrame(loop);
      }
      loop();

      function checkOrientation() {
        document.getElementById('rotateNotice').style.display =
          window.innerHeight > window.innerWidth ? 'flex' : 'none';
      }
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
      checkOrientation();
    });
