<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DK FINAL GAME</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #222;
    }
    #controls {
      position: absolute;
      width: 100%;
      text-align: center;
      bottom: 20px;
    }
    #controls button {
      background: white;
      border: none;
      padding: 20px 40px;
      margin: 0 30px;
      font-size: 30px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas" width="900" height="1500"></canvas>

  <div id="controls">
    <button id="leftBtn">◀️</button>
    <button id="rightBtn">▶️</button>
    <button id="upBtn">⬆️</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ✅ Ball starts near bottom
    const ball = { x: 450, y: 1450, radius: 20, dx: 0, dy: 0, onGround: false };
    const gravity = 0.5;
    const jumpPower = -15;

    let cameraY = 0;

    // ✅ Floor at bottom
    const blocks = [
      { x: 0, y: 1480, width: 900, height: 20 },
      { x: 0, y: 0, width: 30, height: 1500 },  // Left wall
      { x: 870, y: 0, width: 30, height: 1500 } // Right wall
    ];

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const upBtn = document.getElementById("upBtn");

    leftBtn.addEventListener("pointerdown", () => ball.dx = -5);
    rightBtn.addEventListener("pointerdown", () => ball.dx = 5);
    upBtn.addEventListener("pointerdown", () => { if (ball.onGround) ball.dy = jumpPower; });

    leftBtn.addEventListener("pointerup", () => ball.dx = 0);
    rightBtn.addEventListener("pointerup", () => ball.dx = 0);

    function update() {
      ball.x += ball.dx;
      ball.y += ball.dy;
      ball.dy += gravity;

      ball.onGround = false;

      // ✅ Proper: show ground at start, follow ball up
      cameraY = -(ball.y - canvas.height + 100);
      if (ball.y < canvas.height - 500) {
        cameraY = -(ball.y - canvas.height + 500);
      }

      for (const block of blocks) {
        if (ball.x + ball.radius > block.x &&
            ball.x - ball.radius < block.x + block.width &&
            ball.y + ball.radius > block.y &&
            ball.y - ball.radius < block.y + block.height) {
          ball.y = block.y - ball.radius;
          ball.dy = 0;
          ball.onGround = true;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Floor and walls
      ctx.fillStyle = "#555";
      for (const block of blocks) {
        ctx.fillRect(block.x, block.y + cameraY, block.width, block.height);
      }

      // Ball
      ctx.fillStyle = "lime";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y + cameraY, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
