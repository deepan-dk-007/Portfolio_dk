<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>DK GAMEZ</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      background: #222;
      display: block;
      margin: 0 auto;
    }

    #controls {
      position: absolute;
      width: 100%;
      text-align: center;
      user-select: none;
      bottom: 20px;
    }

    #controls button {
      background-color: white;
      border: none;
      padding: 10px 45px;
      margin: 0 35px;
      font-size: 100px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas" width="900" height="1500"></canvas>
  <div id="controls">
    <button id="leftBtn">◀️</button>
    <button id="upBtn">⬆️</button>
    <button id="rightBtn">▶️</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const ball = { x: 830, y: 1350, radius: 20, dx: 0, dy: 0, onGround: false };
    const gravity = 0.4;
    const jumpPower = -10;

    const blocks = [
      { x: 0, y: 1400, width: 900, height: 120 },  // floor
      { x: 0, y: 0, width: 30, height: 1500 },     // left wall
      { x: 870, y: 0, width: 30, height: 1500 },   // right wall
      { x: 0, y: 0, width: 900, height: 30 },      // top wall
      { x: 100, y: 1270, width: 800, height: 30 },
      { x: 0, y: 1150, width: 800, height: 30 },
      { x: 100, y: 1000, width: 800, height: 30 },
      { x: 0, y: 850, width: 800, height: 30 },
      { x: 100, y: 720, width: 800, height: 30 },
      { x: 0, y: 600, width: 800, height: 30 },
      // crazy vertical blocks
      { x: 400, y: 800, width: 30, height: 300 },
      { x: 250, y: 500, width: 30, height: 400 },
      { x: 600, y: 950, width: 30, height: 350 }
    ];

    const obstacles = [
      { x: 150, y: 1260, width: 30, height: 40, dy: 1, sy: 1260 },
      { x: 550, y: 1000, width: 30, height: 40, dy: 1, sy: 1000 },
      { x: 150, y: 850, width: 30, height: 40, dy: 1, sy: 850 },
      { x: 700, y: 720, width: 30, height: 40, dy: 1, sy: 720 },
      { x: 500, y: 580, width: 30, height: 50, dx: 1, sx: 620 }
    ];

    const gate = [
      { x: 30, y: 560, width: 30, height: 40, mov: false },
    ];

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') ball.dx = 3;
      if (e.key === 'ArrowLeft') ball.dx = -3;
      if (e.key === 'ArrowUp' && ball.onGround) ball.dy = jumpPower;
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') ball.dx = 0;
    });

    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');
    const upBtn = document.getElementById('upBtn');

    leftBtn.addEventListener('mousedown', () => ball.dx = -3);
    rightBtn.addEventListener('mousedown', () => ball.dx = 3);
    upBtn.addEventListener('click', () => { if (ball.onGround) ball.dy = jumpPower; });

    leftBtn.addEventListener('mouseup', () => ball.dx = 0);
    rightBtn.addEventListener('mouseup', () => ball.dx = 0);

    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); ball.dx = -3 });
    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); ball.dx = 3 });
    upBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (ball.onGround) ball.dy = jumpPower; });

    leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); ball.dx = 0 });
    rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); ball.dx = 0 });

    function update() {
      ball.x += ball.dx;
      ball.y += ball.dy;
      ball.dy += gravity;

      ball.onGround = false;

      for (const block of blocks) {
        // Top collision
        if (
          ball.x + ball.radius > block.x &&
          ball.x - ball.radius < block.x + block.width &&
          ball.y + ball.radius > block.y &&
          ball.y + ball.radius < block.y + block.height &&
          ball.dy >= 0
        ) {
          ball.y = block.y - ball.radius;
          ball.dy = 0;
          ball.onGround = true;
        }

        // Left collision
        if (
          ball.y + ball.radius > block.y &&
          ball.y - ball.radius < block.y + block.height &&
          ball.x + ball.radius > block.x &&
          ball.x < block.x &&
          ball.dx > 0
        ) {
          ball.x = block.x - ball.radius;
          ball.dx = 0;
        }

        // Right collision
        if (
          ball.y + ball.radius > block.y &&
          ball.y - ball.radius < block.y + block.height &&
          ball.x - ball.radius < block.x + block.width &&
          ball.x > block.x + block.width &&
          ball.dx < 0
        ) {
          ball.x = block.x + block.width + ball.radius;
          ball.dx = 0;
        }
      }

      for (const obs of obstacles) {
        // X direction
        if (obs.dx) {
          obs.x += obs.dx;
          if (obs.x > obs.sx + 100) { obs.x = obs.sx + 100; obs.dx *= -1; }
          if (obs.x < obs.sx - 100) { obs.x = obs.sx - 100; obs.dx *= -1; }
        }

        // Y direction
        if (obs.dy) {
          obs.y += obs.dy;
          if (obs.y > obs.sy + 100) { obs.y = obs.sy + 100; obs.dy *= -1; }
          if (obs.y < obs.sy - 100) { obs.y = obs.sy - 100; obs.dy *= -1; }
        }

        if (
          ball.x + ball.radius > obs.x &&
          ball.x - ball.radius < obs.x + obs.width &&
          ball.y + ball.radius > obs.y &&
          ball.y - ball.radius < obs.y + obs.height
        ) {
          alert('You Out');
          ball.x = 830; ball.y = 1350; ball.dx = 0; ball.dy = 0;
        }
      }

      for (const gbs of gate) {
        if (
          ball.x + ball.radius > gbs.x &&
          ball.x - ball.radius < gbs.x + gbs.width &&
          ball.y + ball.radius > gbs.y &&
          ball.y - ball.radius < gbs.y + gbs.width &&
          !gbs.mov
        ) {
          gbs.x = 830; gbs.y = 1350; gbs.mov = true;
        }

        if (
          ball.x + ball.radius > gbs.x &&
          ball.x - ball.radius < gbs.x + gbs.width &&
          ball.y + ball.radius > gbs.y &&
          ball.y - ball.radius < gbs.y + gbs.height
        ) {
          alert('You WIN!!!');
          ball.x = 50; ball.y = 550; ball.dx = 0; ball.dy = 0;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#555';
      for (const block of blocks) {
        ctx.fillRect(block.x, block.y, block.width, block.height);
      }

      ctx.fillStyle = '#f00';
      for (const obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      }

      ctx.fillStyle = '#0f0';
      for (const gbs of gate) {
        ctx.fillRect(gbs.x, gbs.y, gbs.width, gbs.height);
      }

      ctx.fillStyle = '#0f0';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>

</html>
