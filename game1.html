<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DK GAMEZ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      background: #222;
      display: block;
      height: 120vh;
      width: 100vw;
    }

    #controls {
      position: absolute;
      width: 100%;
      bottom: 20px;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      user-select: none;
      -webkit-user-select: none;
    }

    .left-controls {
      display: flex;
      gap: 20px;
    }

    .right-controls {
      display: flex;
      gap: 20px;
    }

    #controls button {
      background-color: white;
      border: none;
      padding: 15px 30px;
      font-size: 25px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #rotateNotice {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      color: #fff;
      font-size: 30px;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 9999;
      padding: 30px;
    }

    #startBtn {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 100px 200px;
      font-size: 30px;
      z-index: 1000;
      background-color: black;
      color: rgb(255, 2, 2);
      user-select: none;
    }

    @keyframes shine {
      from { background-position: -200% 0; }
      to { background-position: 200% 0; }
    }

    #startBtn h1 {
      padding: 10px;
      border-radius: 50px;
      border: 3px solid white;
      color: transparent;
      background: linear-gradient(132deg, violet, darkblue, purple);
      background-size: 200%;
      background-clip: text;
      animation: shine 1s linear infinite;
    }

    .centerOverlay {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: white;
      padding: 50px 100px;
      font-size: 30px;
      border: 3px solid white;
      border-radius: 10px;
      z-index: 1001;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas" width="900" height="1000"></canvas>

  <div id="controls">
    <div class="left-controls">
      <button id="leftBtn">◀️</button>
      <button id="rightBtn">▶️</button>
    </div>
    <div class="right-controls">
      <button id="upBtn">⬆️</button>
    </div>
  </div>

  <div id="rotateNotice">
    📱 Please rotate your device to <strong>landscape</strong> mode to play the game!
  </div>

  <div>
    <button id="startBtn"><h1>Start Game</h1></button>
  </div>

  <div id="playAgainOverlay" class="centerOverlay">Play Again</div>
  <div id="youWinOverlay" class="centerOverlay">You Win</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const ball = { x: 830, y: 630, radius: 10, dx: 0, dy: 0, onGround: false };
    const gravity = 0.5;
    const jumpPower = -10;

    const blocks = [
      { x: 0, y: 650, width: 600, height: 520 },
      { x: 650, y: 650, width: 300, height: 520 },
      { x: 0, y: 0, width: 30, height: 1500 },
      { x: 870, y: 0, width: 30, height: 1500 },
      { x: 0, y: 0, width: 900, height: 30 },
      { x: 80, y: 560, width: 800, height: 10 },
      { x: 30, y: 460, width: 800, height: 10 },
      { x: 80, y: 360, width: 800, height: 10 },
      { x: 30, y: 260, width: 800, height: 10 },
      { x: 80, y: 160, width: 650, height: 10 },
      { x: 770, y: 160, width: 120, height: 10 },
      { x: 80, y: 560, width: 10, height: 50 },
      { x: 830, y: 460, width: 10, height: 50 },
      { x: 80, y: 360, width: 10, height: 50 },
      { x: 830, y: 260, width: 10, height: 50 },
      { x: 80, y: 160, width: 10, height: 50 },
    ];

    const obstacles = [
      { x: 600, y: 680, width: 50, height: 150, dy: 1, sy: 350 },
      { x: 750, y: 380, width: 10, height: 40, dy: 1, sy: 350 },
      { x: 550, y: 550, width: 10, height: 40, dy: 1, sy: 650 },
      { x: 160, y: 400, width: 10, height: 40, dy: 1, sy: 400 },
      { x: 500, y: 350, width: 10, height: 40, dy: 1, sy: 320 },
      { x: 300, y: 230, width: 10, height: 40, dy: 1, sy: 220 },
      { x: 600, y: 130, width: 10, height: 40, dx: 1, sx: 620 }
    ];

    const gate = [
      { x: 830, y: 120, width: 30, height: 40, mov: false },
    ];

    function requestFull() {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      requestFull();
      document.getElementById('startBtn').style.display = 'none';

      const leftBtn = document.getElementById('leftBtn');
      const rightBtn = document.getElementById('rightBtn');
      const upBtn = document.getElementById('upBtn');

      function bindControl(btn, onDown, onUp) {
        btn.addEventListener('touchstart', e => { e.preventDefault(); requestFull(); onDown(); });
        btn.addEventListener('pointerdown', e => { e.preventDefault(); requestFull(); onDown(); });

        btn.addEventListener('touchend', e => { e.preventDefault(); onUp(); });
        btn.addEventListener('pointerup', e => { e.preventDefault(); onUp(); });
      }

      bindControl(leftBtn, () => ball.dx = -3, () => ball.dx = 0);
      bindControl(rightBtn, () => ball.dx = 3, () => ball.dx = 0);
      bindControl(upBtn, () => { if (ball.onGround) ball.dy = jumpPower; }, () => {});

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') ball.dx = 3;
        if (e.key === 'ArrowLeft') ball.dx = -3;
        if (e.key === 'ArrowUp' && ball.onGround) ball.dy = jumpPower;
      });

      document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') ball.dx = 0;
      });

      const playAgainOverlay = document.getElementById('playAgainOverlay');
      const youWinOverlay = document.getElementById('youWinOverlay');

      playAgainOverlay.addEventListener('click', () => location.reload());
      youWinOverlay.addEventListener('click', () => location.reload());

      function update() {
        ball.x += ball.dx;
        ball.y += ball.dy;
        ball.dy += gravity;

        ball.onGround = false;

        for (const block of blocks) {
          const closestX = Math.max(block.x, Math.min(ball.x, block.x + block.width));
          const closestY = Math.max(block.y, Math.min(ball.y, block.y + block.height));
          const dx = ball.x - closestX;
          const dy = ball.y - closestY;

          if (dx * dx + dy * dy < ball.radius * ball.radius) {
            const overlapX = ball.radius - Math.abs(dx);
            const overlapY = ball.radius - Math.abs(dy);

            if (overlapX < overlapY) {
              ball.x += dx > 0 ? overlapX : -overlapX;
              ball.dx = 0;
            } else {
              ball.y += dy > 0 ? overlapY : -overlapY;
              ball.dy = 0;
              if (dy < 0) ball.onGround = true;
            }
          }
        }

        for (const obs of obstacles) {
          if (obs.dx) {
            obs.x += obs.dx;
            if (obs.x > obs.sx + 100) obs.dx *= -1;
            if (obs.x < obs.sx - 100) obs.dx *= -1;
          }
          if (obs.dy) {
            obs.y += obs.dy;
            if (obs.y > obs.sy + 100) obs.dy *= -1;
            if (obs.y < obs.sy - 100) obs.dy *= -1;
          }

          if (
            ball.x + ball.radius > obs.x && ball.x - ball.radius < obs.x + obs.width &&
            ball.y + ball.radius > obs.y && ball.y - ball.radius < obs.y + obs.height
          ) {
            playAgainOverlay.style.display = 'block';
            cancelAnimationFrame(anim);
          }
        }

        for (const gbs of gate) {
          if (
            ball.x + ball.radius > gbs.x && ball.x - ball.radius < gbs.x + gbs.width &&
            ball.y + ball.radius > gbs.y && ball.y - ball.radius < gbs.y + gbs.width && !gbs.mov
          ) {
            gbs.x = 830; gbs.y = 610; gbs.mov = true;
          }
          if (
            ball.x + ball.radius > gbs.x && ball.x - ball.radius < gbs.x + gbs.width &&
            ball.y + ball.radius > gbs.y && ball.y - ball.radius < gbs.y + gbs.height
          ) {
            youWinOverlay.style.display = 'block';
            cancelAnimationFrame(anim);
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'black';
        for (const block of blocks) ctx.fillRect(block.x, block.y, block.width, block.height);

        ctx.fillStyle = 'purple';
        for (const obs of obstacles) ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        ctx.fillStyle = 'gold';
        for (const gbs of gate) ctx.fillRect(gbs.x, gbs.y, gbs.width, gbs.height);

        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      let anim;
      function loop() {
        update();
        draw();
        anim = requestAnimationFrame(loop);
      }
      loop();

      function checkOrientation() {
        document.getElementById('rotateNotice').style.display =
          window.innerHeight > window.innerWidth ? 'flex' : 'none';
      }
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
      checkOrientation();
    });
  </script>
</body>
</html>
